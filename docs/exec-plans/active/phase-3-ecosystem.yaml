    title: "Phase 3 集成测试 + 全生态端到端验证"
    status: pending
    design_ref: "docs/design-docs/testing-strategy.md"
    impl_targets:
      - harness/suites/phase3_integration.yaml         # MODIFY/创建（已有占位文件则完善）
      - src-tauri/src/modules/runtime/integration_phase3.rs  # 必须新建

    current_state: |
      harness/suites/phase3_integration.yaml 不存在。
      src-tauri/src/modules/runtime/integration_phase3.rs 不存在。
      ❌ MISSING — 必须新建测试文件和 harness suite：
        1. integration_phase3.rs：4 个端到端集成测试函数，覆盖 HTTP API + LSP Bridge +
           TrajectoryCollector，使用 Mock 对象，不依赖真实 API key
        2. phase3_integration.yaml：test_fn 路径指向 integration_phase3.rs 中的真实函数

    must_implement:
      - |
        // testing-strategy.md §集成测试 — 新建 integration_phase3.rs
        #[tokio::test]
        async fn test_http_api_server_chat_endpoint() { ... }  // POST /v1/chat，mock AppState
        #[tokio::test]
        async fn test_lsp_bridge_handle_run_turn() { ... }     // pipe stdin JSON-RPC，断言 stdout
        #[tokio::test]
        async fn test_trajectory_collector_writes_jsonl() { ... }  // 3 条轨迹，断言文件内容
        #[tokio::test]
        async fn test_reward_calculator_weighted_sum() { ... } // 两个奖励函数加权，断言分数范围
      - |
        // phase3_integration.yaml: 创建并填写 4 个 test_cases，
        // test_fn 路径为 runtime::integration_phase3::test_*

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/modules/runtime/integration_phase3.rs"
        grep: "test_http_api_server_chat_endpoint"
        label: "HTTP API integration test"
      - type: symbol
        file: "src-tauri/src/modules/runtime/integration_phase3.rs"
        grep: "test_lsp_bridge_handle_run_turn"
        label: "LSP Bridge integration test"
      - type: test
        cmd: "cargo test -p if2ai-backend"
        expect: "all tests pass"
      - type: harness
        suite: "harness/suites/phase3_integration.yaml"
    review_checklist:
      - "integration_phase3.rs 是否有 4 个集成测试，全部用 Mock 对象"
      - "test_http_api_server_chat_endpoint 是否启动一个测试用的 axum app（不绑定真实端口）"
      - "test_lsp_bridge_handle_run_turn 是否通过 Cursor/pipe 模拟 stdin 消息"
      - "test_trajectory_collector_writes_jsonl 是否使用 tempdir，测试后自动清理"
      - "phase3_integration.yaml test_fn 路径是否与实际函数名完全一致"
      - "docs/generated/QUALITY_SCORE.md 已追加 Phase 3 完成记录"
      - "无 TODO / unwrap() 在非测试代码中"

