    must_implement:
      - |
        // 08-critical-fix-priority.md §UI-8 — TodoWrite 后端已在 5c.2 完成
        // 参考: src-tauri/src/modules/tools/builtin/todo_write.rs
        // 本 slice 只需关注前端部分。

      - |
        // 08-critical-fix-priority.md §UI-8 — TodoPanel 前端 (新建 TodoPanel.tsx)
        interface TodoItem {
          content: string;
          activeForm: string;
          status: "pending" | "in_progress" | "completed";
        }

        function TodoPanel({ todos }: { todos: TodoItem[] }) {
          if (todos.length === 0) return null;
          const completedCount = todos.filter(t => t.status === "completed").length;
          const allDone = todos.every(t => t.status === "completed");

          return (
            <div className="border-b bg-muted/20 px-4 py-2">
              <div className="flex items-center justify-between text-xs text-muted-foreground">
                <span className="font-medium text-foreground">
                  Tasks ({completedCount}/{todos.length} completed)
                </span>
                {allDone && <span>All tasks completed ✓</span>}
              </div>
              {!allDone && (
                <div className="mt-1 space-y-0.5">
                  {todos.map((todo, i) => (
                    <TodoItemRow key={i} todo={todo} />
                  ))}
                </div>
              )}
            </div>
          );
        }

        function TodoItemRow({ todo }: { todo: TodoItem }) {
          const icon = { pending: "○", in_progress: "◐", completed: "✓" }[todo.status];
          const color = { pending: "text-muted-foreground", in_progress: "text-blue-500 animate-pulse", completed: "text-green-500" }[todo.status];
          return (
            <div className={cn("flex items-center gap-2 text-sm", color)}>
              <span className="w-4 text-center font-mono">{icon}</span>
              <span className="flex-1 truncate">{todo.activeForm}</span>
            </div>
          );
        }

      - |
        // 08-critical-fix-priority.md §UI-8 — App.tsx SSE 事件解析
        const [todos, setTodos] = useState<TodoItem[]>([]);

        if (payload.event_type === 'tool_call_update' && payload.tool_name === 'TodoWrite') {
          try {
            const result = JSON.parse(payload.tool_result || '{}');
            if (result.newTodos) {
              setTodos(result.newTodos);
            }
          } catch (e) { /* ignore parse error */ }
        }

        if (payload.event_type === 'stream_complete') {
          setTodos([]);
        }

    acceptance:
