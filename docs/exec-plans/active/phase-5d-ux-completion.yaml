  # ───────────── Stage 7: SlashCommand 前端交互层 ─────────────────────

  - id: "5d.7"
    title: "F11 前端 — SlashCommand 交互层（/ 检测 + Tab 补全 + 下拉建议）"
    status: pending
    design_ref: "docs/bs_gap/08-critical-fix-priority.md"
    backlog_ref: "F11"
    impl_targets:
      - src/components/ui/chat-ui.tsx    # MODIFY: 新增 slashOverlay 状态 + SlashCommandSuggestions 组件
      - src/lib/tauri.ts                 # MODIFY: 新增 SlashCommand Tauri command 类型

    baseline_ref: "rust/crates/commands/src/lib.rs (suggest_slash_commands:576-613); src-tauri/src/modules/commands/lib.rs (副本)"

    current_state: |
      ChatUI 的 textarea handleKeyDown 不检查 / 前缀，所有输入直接发给 LLM。
      ❌ MISSING — 新增三层交互：
        1. 实时检测 / 前缀（50ms debounce）
        2. Tab/Enter 补全，上下箭头导航，Escape 关闭
        3. 下拉建议层

    must_implement:
      - |
        // 08-critical-fix-priority.md §F11 — SlashCommand 交互层 (chat-ui.tsx)
        // 使用 useRef 存储 timer，避免 race condition
        const slashTimerRef = useRef<ReturnType<typeof setTimeout> | null>(null);

        const [slashOverlay, setSlashOverlay] = useState<{
          visible: boolean;
          selectedIndex: number;
          suggestions: string[];
          rawInput: string;
        } | null>(null);

        // handleInput — 实时检测 / 前缀
        const handleInput = (value: string) => {
          // 清除上一个 timer（ref 方式，不依赖 onInput return cleanup）
          if (slashTimerRef.current) {
            clearTimeout(slashTimerRef.current);
            slashTimerRef.current = null;
          }

          if (value.startsWith('/')) {
            const cmdPart = value.split(/\s+/)[0];
            slashTimerRef.current = setTimeout(async () => {
              try {
                const suggestions = await invoke<string[]>('suggest_slash_commands_endpoint', {
                  input: cmdPart, limit: 8
                });
                setSlashOverlay({
                  visible: suggestions.length > 0,
                  selectedIndex: 0,
                  suggestions,
                  rawInput: cmdPart,
                });
              } catch (e) { setSlashOverlay(null); }
            }, 50);
          } else {
            setSlashOverlay(null);
          }
        };

        // handleKeyDown — 覆盖原有 Enter 处理
        if (slashOverlay?.visible) {
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            setSlashOverlay(prev => prev ? { ...prev, selectedIndex: (prev.selectedIndex + 1) % prev.suggestions.length } : null);
          }
          if (e.key === 'ArrowUp') {
            e.preventDefault();
            setSlashOverlay(prev => prev ? { ...prev, selectedIndex: (prev.selectedIndex - 1 + prev.suggestions.length) % prev.suggestions.length } : null);
          }
          if (e.key === 'Tab' || e.key === 'Enter') {
            e.preventDefault();
            const selected = slashOverlay.suggestions[slashOverlay.selectedIndex];
            setInput(selected);
            setSlashOverlay(null);
            return;
          }
          if (e.key === 'Escape') {
            setSlashOverlay(null);
            return;
          }
        }
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (input.startsWith('/')) {
            // 执行 slash command（不发到 LLM）
            invoke('execute_slash_command', { input, sessionId: activeSessionId })
              .then(result => addSystemMessage(result));
            return;
          }
          if (input.trim() && !isLoading) onSubmit();
        }

