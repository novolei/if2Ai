slices:

  - id: "6h.1"
    title: "Harness Core Contracts — TaskSpec / TraceRecord / OutcomeSnapshot / Report"
    status: pending
    design_ref: "docs/design-docs/harness/modules-harness-core-contracts.md"
    impl_targets:
      - src-tauri/src/modules/harness/mod.rs
      - src-tauri/src/modules/harness/task.rs
      - src-tauri/src/modules/harness/trace.rs
      - src-tauri/src/modules/harness/outcome.rs
      - src-tauri/src/modules/harness/report.rs
      - src-tauri/src/modules/harness/registry.rs
    must_implement:
      - "TaskSpec v1 与子结构：TaskDomain, TaskCategory, TaskPrompt, TaskSetup, TaskExpectations, ExecutionPlan"
      - "TraceRecord v1 与 TraceEvent / TraceSummary"
      - "OutcomeSnapshot v1：workspace / session / memory / control_plane"
      - "HarnessRunReport / TaskRunResult / TaskAggregateResult"
      - "所有 schema 均显式带 version，支持 serde round-trip"
    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai"
      - type: test
        cmd: "cargo test -p if2ai harness::task_schema harness::trace_schema harness::outcome_schema"
    review_checklist:
      - "契约不绑定 Python runner/evaluator/fixture/suite"
      - "TaskDomain 与 general productivity 相关 expectation 已进入 v1 schema"
      - "TraceRecord 不直接等同于采集层 AgentEvent"

  - id: "6h.2"
    title: "Trace Adapters — AgentEvent / AuditEvent / Runtime State 映射"
    status: pending
    design_ref: "docs/design-docs/harness/modules-harness-core-contracts.md"
    depends_on: ["6h.1"]
    impl_targets:
      - src-tauri/src/modules/harness/trace.rs
      - src-tauri/src/modules/harness/agent_loop_integration.rs
      - src-tauri/src/modules/harness/event_bus.rs
      - src-tauri/src/modules/control_plane/audit.rs
      - src-tauri/src/commands/agent.rs
    must_implement:
      - "AgentEvent -> TraceEvent adapter"
      - "AuditEvent -> TraceEvent adapter"
      - "task/session/request/trace id 关联"
      - "TraceSummary finalize 逻辑"
      - "ContextCompacted / ResumeApplied / PolicyDecision / ToolResult 等关键事件映射"
    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai"
      - type: test
        cmd: "cargo test -p if2ai harness::trace_adapters"
    review_checklist:
      - "映射优先使用结构化字段，不依赖自然语言 message 解析"
      - "tool / permission / compaction / resume 关键路径均可追踪"
      - "不破坏现有 event bus 与 telemetry 行为"

