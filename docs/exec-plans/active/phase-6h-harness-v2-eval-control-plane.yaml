# ─────────────────────────────────────────────────────────────────────────────
# Recommended Execution Order
# ─────────────────────────────────────────────────────────────────────────────
# Main critical path:
# 6h.1 -> 6h.2 -> 6h.3 -> 6h.4 -> 6h.5 -> 6h.8 -> 6h.10 -> 6h.9 -> 6h.11 -> 6h.12
#
# Parallel side path:
# 6h.6 -> 6h.7
#
# Phase grouping:
# A. Eval Kernel:
#    6h.1, 6h.2, 6h.3, 6h.4
# B. General Productivity Core:
#    6h.5, 6h.8, 6h.10
# C. MVP Task Pack Validation:
#    6h.9
# D. Archive + Transparency Completion:
#    6h.6, 6h.7, 6h.11, 6h.12
#
# Ordering rationale:
# - Freeze contracts first, or every downstream slice will churn.
# - Build the eval loop before archive/query surfaces.
# - Land general productivity grading before MVP packs, so the system does not
#   regress into coding-only evaluation.
# - Introduce front-end transparency only after a stable user-facing view model
#   exists (`6h.10`), to avoid binding UI directly to raw harness internals.

# ─────────────────────────────────────────────────────────────────────────────
# 依赖关系
# ─────────────────────────────────────────────────────────────────────────────
# 6h.1 Core Contracts ──┬── 6h.2 Trace Adapters
#                       ├── 6h.3 TaskPack + TrialRunner
#                       ├── 6h.4 Outcome + Base Graders
#                       └── 6h.6 Archive Foundation
# 6h.4 ──┬── 6h.5 UX Graders
#         └── 6h.8 Orchestrator / Regression / Learning Sink
# 6h.6 ─────── 6h.7 Archive Query + Export + CLI
# 6h.3 + 6h.5 + 6h.8 ─── 6h.9 MVP Task Packs + Integration Tests
# 6h.4 + 6h.5 + 6h.8 ─── 6h.10 Transparency View Models
# 6h.10 ──┬── 6h.11 Message Provenance + Partial Success
#         └── 6h.12 Turn Inspector + Expert Telemetry
