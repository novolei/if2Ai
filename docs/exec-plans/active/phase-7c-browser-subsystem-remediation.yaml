  - id: "7C.1"
    name: "Browser Profile Persistence — cookies/login 跨重启保留"
    status: done
    priority: P0
    design_ref: docs/design-docs/postCLI/ADR/ADR-015-Browser-Subsystem-Remediation-Design.md §G1
    estimated_days: 2

    current_state: |
      src-tauri/src/modules/browser/session.rs:117 用 tempfile::Builder::tempdir() 建临时
      user-data-dir，再 :167 调 start_incognito_context() 套一层无痕。
      Chromium 进程退出后所有 cookies / localStorage / IndexedDB / cache 全部清空。
      "帮我看 GitHub 通知"、"清掉我 Gmail 垃圾" 这类需要登录的任务 100% 失败。
      openhanako 用 session.fromPartition("persist:hana-browser") 自动落盘到
      ~/Library/Application Support/openhanako/Partitions/，cookies 永久持久化。

    must_implement:
      - "src-tauri/src/modules/browser/profile.rs — pub enum BrowserProfileMode { PerSessionPersistent, Shared, Ephemeral }"
      - "BrowserProfileMode::from_env_or_config(if2ai_home) — 解析 env IF2AI_BROWSER_PROFILE_MODE + ~/.if2ai/browser.toml [browser] profile_mode 字段"
      - "BrowserProfileMode::resolve(if2ai_home, session_id) -> Result<ProfileHandle> — 创建/获取 user-data-dir，PerSessionPersistent 用 <data_dir>/if2ai/browser-profiles/<session_id>/、Shared 用 .../_shared/、Ephemeral 用 tempdir"
      - "pub struct ProfileHandle { pub path: PathBuf, _guard: Option<TempDir> } — Drop 仅在 Ephemeral 删目录"
      - "BrowserSession::new 签名改为 (session_id, profile_mode: BrowserProfileMode, if2ai_home: &Path) -> Result<Self>"
      - "BrowserSession 移除 start_incognito_context() 调用，直接 browser.new_page(\"about:blank\")"
      - "BrowserSession::_data_dir 字段改名为 _profile: ProfileHandle"
      - "BrowserSession::new_for_test(id) -> Result<Self> 包装函数 — 默认 Ephemeral 模式 + tempdir，给所有现有测试用"
      - "BrowserRegistry::new 签名改为 (cold_state_path, profile_mode, if2ai_home)"
      - "BrowserRegistry::for_test(path) -> Arc<Self> 包装 — Ephemeral 模式"
      - "main.rs 用 BrowserProfileMode::from_env_or_config(&if2ai_dir) 构造 registry"
      - "src-tauri/src/commands/browser.rs 新增 #[tauri::command] clear_browser_profile(session_id) — 必须 session 已 close 才能调用"
      - "src-tauri/src/commands/browser.rs 新增 #[tauri::command] list_browser_profiles() -> Vec<ProfileEntry { session_id, path, size_bytes, last_used }>"
      - "src-tauri/gen/schemas/capabilities.json 注册 clear_browser_profile + list_browser_profiles 权限"
      - "browser.toml 配置示例文件：~/.if2ai/browser.toml.example，含 profile_mode / max_profile_disk_mb / max_total_disk_mb 注释"

    impl_targets:
      - src-tauri/src/modules/browser/profile.rs
      - src-tauri/src/modules/browser/mod.rs
      - src-tauri/src/modules/browser/session.rs
      - src-tauri/src/modules/browser/registry.rs
      - src-tauri/src/commands/browser.rs
      - src-tauri/src/main.rs
      - src-tauri/gen/schemas/capabilities.json

    acceptance:
      - "cargo test browser::profile 全通过"
      - "集成测试 browser_profile_persistence: launch(PerSessionPersistent) → navigate → set cookie via evaluate → close → relaunch → cookie 仍然存在"
      - "集成测试 browser_profile_ephemeral: launch(Ephemeral) → set cookie → close → relaunch → cookie 不存在"
      - "clear_browser_profile 在 session 仍 running 时返回 'session must be closed first' 错误"
      - "list_browser_profiles 返回的 size_bytes 是真实磁盘占用（非 0）"
      - "现有 712 个测试无回归（旧测试通过 BrowserSession::new_for_test 路径）"

    review_checklist:
      - "BrowserProfileMode 三个 variant 都有 doc comment"
      - "ProfileHandle::Drop 实现仅在 Ephemeral 时删目录（用 match arm 显式判断）"
      - "BrowserSession::new 不再调用 start_incognito_context()"
      - "main.rs 默认 PerSessionPersistent，可通过 env / toml 切换"
      - "无 unwrap()，无 expect() 在生产路径"
      - "Tauri 命令在 capabilities.json 中精确声明，无 wildcard"

