# Phase 1: 核心框架搭建 (Foundation)
# ─────────────────────────────────────────────────────────────────────────────
# 格式说明：
#   每个 slice 是 executor 的最小独立工作单元。
#   executor 按 slices 顺序执行，遇到 status: done 的跳过。
#   必须通过 acceptance 中所有检查 + review_checklist 才能标记为 done。
# ─────────────────────────────────────────────────────────────────────────────

meta:
  phase: 1
  title: "核心框架搭建 (Foundation)"
  owner: "@architects"
  design_docs:
    - docs/design-docs/system-architecture-framework.md
    - docs/design-docs/module-boundaries-and-integration.md
    - docs/design-docs/entry-points-design.md
  human_checkpoints:
    - after_slice: "1.9"   # Phase 1 全部完成后需要人工 review 后才能激活 Phase 2

slices:

  # ───────────── Stage 1: Rust 模块骨架 ─────────────────────────────────────

  - id: "1.1"
    title: "建立 Rust 模块骨架（runtime / api / tools / commands / plugins）"
    status: done
    design_ref: "docs/design-docs/module-boundaries-and-integration.md"
    impl_targets:
      - src-tauri/src/modules/runtime/mod.rs
      - src-tauri/src/modules/api/mod.rs
      - src-tauri/src/modules/tools/mod.rs
      - src-tauri/src/modules/commands/mod.rs
      - src-tauri/src/modules/plugins/mod.rs
    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
    review_checklist:
      - "模块层级是否与 module-boundaries-and-integration.md 中的结构一致"
      - "所有 mod.rs 是否有 pub use 导出公开接口"
      - "无循环依赖（runtime 不能 use api，api 可以被 runtime 使用）"
    notes: "slices 1.3-1.9 reset to pending: were incorrectly marked done without code implementation"

  - id: "1.2"
    title: "修复所有 Rust 编译错误（52 个错误）"
    status: done
    design_ref: "docs/design-docs/system-architecture-framework.md"
    impl_targets:
      - src-tauri/src/modules/api/providers/claw_provider.rs
      - src-tauri/src/modules/api/providers/openai_compat.rs
      - src-tauri/src/modules/runtime/config.rs
    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
        expect: "zero errors"
    review_checklist:
      - "所有跨模块引用使用 crate::modules::* 路径，而非旧的 crate:: 前缀"
      - "const fn 中不调用非 const 方法"
      - "所有闭包参数类型明确"
      - "无 unwrap()——仅允许在测试代码中使用"
      - "cargo check 输出零 error、warnings 数量不增加"

  - id: "1.3"
    title: "ConversationRuntime 核心实现（Agent 对话循环）"
    status: done
    design_ref: "docs/design-docs/agent-loop.md"
    impl_targets:
      - src-tauri/src/modules/runtime/conversation.rs

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/modules/runtime/conversation.rs"
        grep: "run_conversation"
        label: "run_conversation() — agent-loop.md §2.2"
      - type: symbol
        file: "src-tauri/src/modules/runtime/conversation.rs"
        grep: "MaxIterationsExceeded"
        label: "RuntimeError::MaxIterationsExceeded — agent-loop.md §3.3"
      - type: symbol
        file: "src-tauri/src/modules/runtime/conversation.rs"
        grep: "build_system_prompt"
        label: "build_system_prompt() — agent-loop.md §3.2"
      - type: test
        cmd: "cargo test -p if2ai-backend -- runtime::conversation"
        expect: "all tests pass"
    review_checklist:
      - "run_conversation() 是否实现了 agent-loop.md §2.2 的多轮状态机（用户消息 → LLM → 工具 → 循环）"
      - "RuntimeError 是否改为 enum，包含 MaxIterationsExceeded / PermissionDenied / SessionError"
      - "run_turn() 循环内是否有 token budget 检查（见 agent-loop.md §3.1）"
      - "build_system_prompt() 是否按 agent-loop.md §3.2 的槽位顺序构建提示"
      - "错误传播使用 ? 操作符，函数签名返回 Result<_, RuntimeError>"
      - "无 unwrap()（测试除外）"
    harness_suite: ~
    notes: "Implemented: RuntimeError enum, run_conversation(), build_system_prompt(), token budget check, max_token_budget field"

  # ───────────── Stage 2: Provider / LLM 集成 ───────────────────────────────

  - id: "1.4"
    title: "ProviderManager 实现（OpenAI / Anthropic / 本地 Mock）"
    status: done
    design_ref: "docs/design-docs/provider-resolution.md"
    impl_targets:
      - src-tauri/src/modules/api/providers/manager.rs   # 必须新建此文件

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/modules/api/providers/manager.rs"
        grep: "pub struct ProviderManager"
        label: "ProviderManager struct — provider-resolution.md §2.2"
      - type: symbol
        file: "src-tauri/src/modules/api/providers/manager.rs"
        grep: "MockProvider"
        label: "MockProvider for testing — provider-resolution.md"
      - type: test
        cmd: "cargo test -p if2ai-backend -- api::providers"
        expect: "all tests pass"
    review_checklist:
      - "manager.rs 是否新建并且 register/get/create_message 方法都已实现"
      - "MockProvider 是否实现 Provider trait，能返回可配置的固定响应"
      - "API key 通过环境变量或构造函数传入，不硬编码"
      - "ProviderManager 在 providers/mod.rs 中 pub use 导出"
      - "无 unwrap()（测试除外）"
    notes: "Implemented: ProviderManager, MockProvider, MockStream, create_message, create_message_default"

  - id: "1.5"
    title: "ToolRegistry 与 3 个基础工具（bash / file_read / json_parse）"
    status: done
    design_ref: "docs/design-docs/tool-system.md"
    impl_targets:
      - src-tauri/src/modules/tools/registry.rs   # 必须新建此文件
      - src-tauri/src/modules/tools/builtin/       # 必须新建此目录下的工具文件

    current_state: |
      tools/lib.rs EXISTS，已有：GlobalToolRegistry、ToolRegistry（简单列表）、execute_tool()。
      ❌ MISSING — 以下接口不存在，必须新建：
        1. ToolRegistry 需重写为 DashMap-based（注册/查询/分发），见 tool-system.md §核心组件
        2. register(entry: ToolEntry) -> Result<()>
        3. get(name: &str) -> Option<ToolEntry>  
        4. dispatch(name: &str, args: &JsonValue) -> Result<String>（异步，有超时）
        5. get_definitions(toolset_names, disabled, quiet) -> Vec<JsonValue>
        6. bash 工具实现（沙箱：超时 30s + 禁止 rm -rf / 危险命令列表）
        7. file_read 工具实现（读取文件内容，有大小限制）
        8. json_parse 工具实现（解析 JSON 字符串并格式化输出）

    must_implement:
      - |
        // tool-system.md §1 ToolRegistry — 重写 registry，新建 registry.rs
        pub struct ToolRegistry {
            tools: Arc<DashMap<String, ToolEntry>>,
        }
        impl ToolRegistry {
            pub fn new() -> Self
            pub fn register(&self, entry: ToolEntry) -> Result<(), String>
            pub fn get(&self, name: &str) -> Option<ToolEntry>
            pub async fn dispatch(&self, name: &str, args: &serde_json::Value) -> Result<String, ToolError>
            pub fn get_definitions(&self, allowed: Option<&[String]>) -> Vec<serde_json::Value>
        }
      - |
        // tool-system.md §具体工具 — 新建 builtin/bash.rs
        pub fn bash_tool_entry() -> ToolEntry  // 包含 30s 超时 + 危险命令黑名单
      - |
        // tool-system.md §具体工具 — 新建 builtin/file_read.rs  
        pub fn file_read_tool_entry() -> ToolEntry  // 包含 1MB 大小限制
      - |
        // tool-system.md §具体工具 — 新建 builtin/json_parse.rs
        pub fn json_parse_tool_entry() -> ToolEntry

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/modules/tools/registry.rs"
        grep: "pub struct ToolRegistry"
        label: "ToolRegistry struct — tool-system.md §1"
      - type: symbol
        file: "src-tauri/src/modules/tools/registry.rs"
        grep: "pub async fn dispatch"
        label: "dispatch() — tool-system.md §1"
      - type: test
        cmd: "cargo test -p if2ai-backend -- tools"
        expect: "all tests pass"
      - type: harness
        suite: "harness/suites/tool_registry_basic.yaml"
    review_checklist:
      - "registry.rs 是否新建，ToolRegistry 基于 DashMap 实现"
      - "dispatch() 是否有超时保护（tokio::time::timeout）"
      - "bash 工具是否有危险命令黑名单检查（rm -rf, sudo 等）"
      - "file_read 工具是否有文件大小限制（> 1MB 时截断或报错）"
      - "每个工具有至少 1 个单元测试"
      - "无 unwrap()（测试除外）"

  # ───────────── Stage 3: Session + Tauri IPC + 前端接线 ───────────────────

  - id: "1.6"
    title: "SessionManager 实现（会话创建 / 消息追加 / 持久化到本地文件）"
    status: done
    design_ref: "docs/design-docs/session-persistence.md"
    impl_targets:
      - src-tauri/src/modules/session/mod.rs     # 必须新建此模块
      - src-tauri/src/modules/session/manager.rs # 必须新建此文件

    current_state: |
      src-tauri/src/modules/commands/session.rs 不存在（原 impl_target 路径有误）。
      src-tauri/src/modules/commands/ 里只有 lib.rs（斜杠命令）和 mod.rs，无 session 管理。
      ❌ MISSING — 整个 SessionManager 模块不存在，必须从零新建：
        1. Session 数据结构（id, title, messages, created_at, token_count）
        2. SessionManager 结构体
        3. create_session(title) -> Result<Session>
        4. restore_session(id) -> Result<Session>（从文件读）
        5. add_user_message(session_id, content) -> Result<()>
        6. add_assistant_message(session_id, content, tool_calls, tokens) -> Result<()>
        7. list_sessions() -> Result<Vec<SessionMeta>>
        8. delete_session(id) -> Result<()>
        9. 持久化：每个会话存 ~/.if2ai/sessions/<id>.json

    must_implement:
      - |
        // session-persistence.md §数据结构
        pub struct Session {
            pub id: String,          // UUID v4
            pub title: String,
            pub messages: Vec<ConversationMessage>,
            pub created_at: String,  // RFC3339
            pub token_count: u64,
        }
        pub struct SessionMeta { pub id: String, pub title: String, pub created_at: String }
      - |
        // session-persistence.md §SessionManager
        pub struct SessionManager { sessions_dir: PathBuf }
        impl SessionManager {
            pub fn new(sessions_dir: PathBuf) -> Self
            pub async fn create_session(&self, title: impl Into<String>) -> Result<Session, SessionError>
            pub async fn restore_session(&self, id: &str) -> Result<Session, SessionError>
            pub async fn save_session(&self, session: &Session) -> Result<(), SessionError>
            pub async fn add_message(&self, session_id: &str, msg: ConversationMessage) -> Result<(), SessionError>
            pub async fn list_sessions(&self) -> Result<Vec<SessionMeta>, SessionError>
            pub async fn delete_session(&self, id: &str) -> Result<(), SessionError>
        }

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/modules/session/manager.rs"
        grep: "pub struct SessionManager"
        label: "SessionManager — session-persistence.md"
      - type: symbol
        file: "src-tauri/src/modules/session/manager.rs"
        grep: "create_session"
        label: "create_session() — session-persistence.md"
      - type: symbol
        file: "src-tauri/src/modules/session/manager.rs"
        grep: "restore_session"
        label: "restore_session() — session-persistence.md"
      - type: test
        cmd: "cargo test -p if2ai-backend -- session"
        expect: "all tests pass"
    review_checklist:
      - "session/manager.rs 是否从零新建（不是修改现有的 commands/lib.rs）"
      - "Session ID 是否使用 UUID v4（uuid crate）"
      - "持久化路径是否使用 PathBuf，支持 ~/.if2ai/sessions/ 或可配置路径"
      - "JSON 序列化使用 serde_json，不手动拼接字符串"
      - "文件读写失败是否映射到 SessionError 而非 panic"

  - id: "1.7"
    title: "Tauri Commands 网关（run_agent_turn / list_sessions / list_tools）"
    status: done
