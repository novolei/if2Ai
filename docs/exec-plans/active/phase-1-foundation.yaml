      src-tauri/src/commands/agent.rs 不存在。
      src-tauri/src/commands/session.rs 不存在。
      src-tauri/src/lib.rs 是否有 invoke_handler 注册未知，需检查。
      ❌ MISSING — 所有 Tauri IPC 命令从零新建：
        1. AppState 结构体（持有 SessionManager + ToolRegistry）
        2. run_agent_turn(state, session_id, user_message) -> Result<RunAgentTurnResponse, String>
        3. run_conversation(state, session_id, user_message) -> Result<String, String>
        4. list_sessions(state) -> Result<Vec<SessionMeta>, String>
        5. delete_session(state, id) -> Result<(), String>
        6. list_tools(state) -> Result<Vec<ToolInfo>, String>
        7. 在 tauri::Builder 中 invoke_handler 注册以上所有命令

    must_implement:
      - |
        // entry-points-design.md §2.2 — agent.rs
        #[derive(serde::Serialize)]
        pub struct RunAgentTurnResponse { pub message: String, pub session_id: String }

        #[tauri::command]
        pub async fn run_agent_turn(
            state: tauri::State<'_, AppState>,
            session_id: String,
            user_message: String,
        ) -> Result<RunAgentTurnResponse, String>
      - |
        // entry-points-design.md §2.2 — mod.rs 中的 AppState
        pub struct AppState {
            pub session_manager: Arc<SessionManager>,
            pub tool_registry: Arc<ToolRegistry>,
        }
        impl AppState { pub fn new() -> Self }
      - |
        // entry-points-design.md §2.2 — session.rs
        #[tauri::command]
        pub async fn list_sessions(state: tauri::State<'_, AppState>) -> Result<Vec<SessionMeta>, String>

        #[tauri::command]
        pub async fn delete_session(state: tauri::State<'_, AppState>, id: String) -> Result<(), String>

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/commands/agent.rs"
        grep: "tauri::command"
        label: "#[tauri::command] in agent.rs — entry-points-design.md §2.2"
      - type: symbol
        file: "src-tauri/src/commands/mod.rs"
        grep: "pub struct AppState"
        label: "AppState — entry-points-design.md §2.2"
      - type: symbol
        file: "src-tauri/src/commands/session.rs"
        grep: "list_sessions"
        label: "list_sessions command — entry-points-design.md §2.2"
      - type: test
        cmd: "cargo test -p if2ai-backend -- commands"
        expect: "all tests pass"
    review_checklist:
      - "命令函数是否全部有 #[tauri::command] 宏"
      - "AppState 是否通过 State<AppState> 注入，不使用全局变量"
      - "错误返回格式是否为 Result<T, String>（Tauri 要求）"
      - "AppState 是否在 lib.rs 的 tauri::Builder 中 .manage(AppState::new()) 注册"
      - "invoke_handler 是否包含所有新命令"
      - "无 unwrap()（测试除外）"

  - id: "1.8"
    title: "前端接线：React App 通过 invoke 调用 Tauri Commands，实现完整对话循环"
    status: pending
