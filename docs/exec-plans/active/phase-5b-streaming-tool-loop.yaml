  - id: "5b.1"
    title: "F8 前后端 — 扩展 StreamTokenPayload 支持 tool_call_update 事件"
    status: done
    design_ref: "docs/bs_gap/08-critical-fix-priority.md"
    backlog_ref: "F8"
    impl_targets:
      - src-tauri/src/commands/agent.rs          # MODIFY: StreamTokenPayload 结构体新增 tool 字段
