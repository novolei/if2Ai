    current_state: |
      agent.rs 第 24-30 行 StreamTokenPayload 只有 stream_id, text, thinking, event_type 四个字段。
      event_type 只支持 text_delta, thinking_delta, thinking_start, stream_complete, stream_error。
      lib/tauri.ts 第 12-17 行 TypeScript 类型对应，缺少 tool_call_update。
      ❌ MISSING — 必须扩展两端类型：
        1. agent.rs: StreamTokenPayload 新增 tool_call_id, tool_name, tool_status, tool_args, tool_result, tool_duration_ms
