          text?: string;
          thinking?: string;
          event_type:
            | 'text_delta'
            | 'thinking_delta'
            | 'thinking_start'
            | 'tool_call_update'
            | 'stream_complete'
            | 'stream_error';
          // tool_call_update 专用字段
