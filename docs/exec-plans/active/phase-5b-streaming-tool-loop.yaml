  # ───────────── Stage 2: InputJsonDelta 累积 ─────────────────────────────

  - id: "5b.2"
    title: "F2 后端 — InputJsonDelta 累积 + tool_use 提取"
    status: done
    design_ref: "docs/bs_gap/08-critical-fix-priority.md"
    backlog_ref: "F2"
    impl_targets:
      - src-tauri/src/commands/agent.rs    # MODIFY: start_agent_stream 后台任务逻辑

    baseline_ref: "rust/crates/runtime/src/conversation.rs (run_turn 完整循环:214-333, pending_tool_uses 提取); src-tauri/src/commands/agent.rs (start_agent_stream:508-769, InputJsonDelta:686, ContentBlockStart:699-712)"

    current_state: |
      agent.rs 第 686 行 InputJsonDelta 被空处理：{...} => {}
      第 699-712 行 ContentBlockStart 只处理 Thinking，不处理 ToolUse。
      第 733-756 行流式结束后只保存 user_msg + assistant_msg（文本），没有 tool_result。
      没有工具循环——没有权限检查、没有工具执行、没有 tool_result 回传。
      ❌ MISSING — 必须在 start_agent_stream 后台任务中实现：
        1. 累积 ContentBlockDelta::InputJsonDelta 到 tool_arguments 缓存（HashMap: tool_call_id → JSON string）
        2. ContentBlockStop 时提取完整 tool_use (id, name, input_json)
        3. ContentBlockStart 中处理 OutputContentBlock::ToolUse，emit tool_call_update { status: "queued" }

    must_implement:
      - |
        // 08-critical-fix-priority.md §F2 — 后台任务修改 (agent.rs:661-731)
        // 新增累积变量：
        let mut tool_arguments: HashMap<String, String> = HashMap::new();
        let mut current_tool_id: Option<String> = None;
        let mut current_tool_name: Option<String> = None;

        // ContentBlockDelta 处理：
        crate::modules::api::ContentBlockDelta::InputJsonDelta { delta } => {
            if let Some(ref id) = current_tool_id {
                tool_arguments.entry(id.clone()).or_default().push_str(&delta);
            }
        }

        // ContentBlockStart 处理：
        ApiStreamEvent::ContentBlockStart(start_event) => {
            match start_event.content_block {
                crate::modules::api::OutputContentBlock::Thinking { .. } => {
                    // 原有 thinking_start 逻辑...
                }
                crate::modules::api::OutputContentBlock::ToolUse { id, name, .. } => {
                    current_tool_id = Some(id.clone());
                    current_tool_name = Some(name.clone());
                    // emit queued event
                    let payload = StreamTokenPayload {
                        stream_id: stream_id_for_task.clone(),
                        text: None, thinking: None,
                        event_type: "tool_call_update".to_string(),
                        tool_call_id: Some(id),
                        tool_name: Some(name),
                        tool_status: Some("queued".to_string()),
                        tool_args: None, tool_result: None, tool_duration_ms: None,
                    };
                    let _ = window.emit("agent-token", payload);
                }
                _ => {}
            }
        }

      - |
        // ContentBlockStop 或 MessageStop 时提取完整 tool_use：
        // 当 current_tool_id 有值且 tool_arguments 中有对应 entry 时：
        if let Some(tool_id) = current_tool_id.take() {
            if let Some(input_json) = tool_arguments.remove(&tool_id) {
                let tool_name = current_tool_name.take().unwrap_or_default();
                // 执行权限检查 → 工具执行 → 返回结果 (留给 5b.3)
                // emit running event
            }
        }

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/commands/agent.rs"
        grep: "tool_arguments: HashMap"
        label: "后台任务有 tool_arguments 累积缓存 — 08 §F2"
      - type: symbol
        file: "src-tauri/src/commands/agent.rs"
        grep: "InputJsonDelta"
        label: "InputJsonDelta 不再被空处理"
      - type: symbol
