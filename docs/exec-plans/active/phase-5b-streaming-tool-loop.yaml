        grep: "tool_call_update"
        label: "emit tool_call_update 事件"
      - type: compile
        cmd: "cargo clippy --workspace --all-targets -- -D warnings"
    review_checklist:
      - "InputJsonDelta 是否被累积到 HashMap 而不是被忽略"
      - "ContentBlockStart 中是否处理了 OutputContentBlock::ToolUse"
      - "是否 emit tool_call_update { status: 'queued' } 事件"
