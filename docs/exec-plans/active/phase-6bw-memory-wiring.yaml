      - 添加 mock embedding provider
      - 使用确定性向量替代模型下载

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: test
        cmd: "cargo test --package if2ai-backend learning"
        label: "LearningModule 测试通过"
      - type: test
        cmd: "cargo test --package if2ai-backend memory::hrr"
        label: "HRR 测试通过（不再 ignore）"
      - type: compile
        cmd: "cargo clippy --workspace --all-targets -- -D warnings"
    review_checklist:
      - "LearningModule 是否在 turn 完成后调用"
      - "Reflection 是否周期性触发"
      - "vector_provider.rs 是否不再有模块级 dead_code"
      - "HRR tests 是否不再 #[ignore]"
      - "Mock embedder 是否生成确定性向量"
      - "无 unwrap()（测试除外）"

