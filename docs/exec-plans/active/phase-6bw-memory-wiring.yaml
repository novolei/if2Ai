  - id: "6bw.6"
    title: "LearningModule 接入 + Vector/HRR dead_code 清理 + 测试修复"
    status: done
    design_ref: "docs/design-docs/postCLI/ADR/ADR-012-Phase6B-Wiring.md"
    backlog_ref: "TASK-012-07; TASK-012-04; TASK-012-10"
    impl_targets:
      - src-tauri/src/modules/learning/mod.rs
      - src-tauri/src/commands/agent.rs
      - src-tauri/src/modules/memory/providers/vector_provider.rs
      - src-tauri/src/modules/memory/hrr/integration.rs
      - src-tauri/src/modules/memory/embedding/fastembed.rs

    baseline_ref: "src-tauri/src/modules/learning/mod.rs (LearningModule 无 init 函数)"

    current_state: |
      - LearningModule 已实现但无调用方
      - VectorMemoryProvider/FastEmbedProvider/HolographicStore 全是 dead code
      - HRR integration tests 标记 #[ignore]
      - FastEmbed tests 标记 #[ignore]

    must_implement: |
      # LearningModule 接入 (TASK-012-07)
      - 添加 init_learning() 函数
      - 在 agent turn 完成后:
        a. learning.record_turn(session, tokens, iterations)
        b. 每 N 个 turn 触发 reflection
        c. learning.update_self_model(reflections)

      # dead_code 清理 (TASK-012-04)
      - 移除 vector_provider.rs 的 #![allow(dead_code)]
      - 替换为函数级 #[allow(dead_code)]
      - 添加 MockEmbedder 用于测试

      # HRR 测试修复 (TASK-012-10)
