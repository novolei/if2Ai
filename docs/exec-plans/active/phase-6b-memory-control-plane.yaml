  # Slice 6b.7: Trajectory Learning (P3)
  # ADR-009 — 轨迹学习（导出用途）
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "6b.7"
    title: "LEARN-2 — TrajectoryManager + ShareGPT JSONL 导出"
    status: pending
    design_ref: "docs/design-docs/postCLI/ADR/ADR-009-Trajectory-Learning-Timing-P3.md"
    backlog_ref: "TASK-009-01 ~ TASK-009-06"
    impl_targets:
      - src-tauri/src/modules/learning/trajectory.rs          # CREATE: Trajectory + TrajectoryManager
      - src-tauri/src/modules/commands/trajectory.rs           # CREATE: Tauri 导出命令

    baseline_ref: "src-tauri/src/modules/session/manager.rs (Session — 无轨迹学习)"

    current_state: |
      无轨迹学习能力。
      Session 数据仅用于当前会话，无持久化用于 RL。

    must_implement: |
      # Trajectory (TASK-009-01)
      - id: String
      - conversations: Vec<ConversationEntry>  # {from: "human"|"gpt", value: String}
      - model_id: String
      - system: String (可选, 隐私保护)
      - temperature: f32
      - turn_metadata: {session_id, timestamp, token_count, tools_used}
      - from_session(session, system_prompt, model_id): 转换方法
      - to_jsonl(): JSONL 序列化

      # TrajectoryManager (TASK-009-02 ~ TASK-009-03)
      - base_path: ~/.if2ai/trajectories/
      - record(session): 追加到当日 JSONL 文件
      - export_all(output): 合并所有轨迹
      - max_file_size: 100MB 轮转
      - 按日期轮转: trajectory_YYYY-MM-DD.jsonl

      # TrajectoryPrivacy (TASK-009-04)
      - include_system_prompt: bool (默认 false)
      - min_session_length: usize (默认 3)
      - anonymize_user_content: bool (默认 true)

      # TrajectoryCompressor (TASK-009-05)
      - compress(trajectories): 过滤低质量 + 截断超长

      # Tauri Commands (TASK-009-06)
      - export_trajectories(output_path): 导出到文件
      - get_trajectory_count(): 获取轨迹数量

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: test
        cmd: "cargo test --package if2ai-backend learning::trajectory"
        label: "Trajectory 测试通过"
      - type: test
        cmd: "cargo test --package if2ai-backend learning::trajectory_manager"
        label: "TrajectoryManager 测试通过"
      - type: compile
        cmd: "cargo clippy --workspace --all-targets -- -D warnings"
    review_checklist:
      - "Trajectory 是否符合 ShareGPT 格式"
      - "Session 是否能转换为 Trajectory"
      - "文件轮转是否正确 (100MB)"
      - "隐私控制是否生效"
      - "导出命令是否正确暴露"
      - "无 unwrap()（测试除外）"

