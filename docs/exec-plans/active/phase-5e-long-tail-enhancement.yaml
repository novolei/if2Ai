        // 08-critical-fix-priority.md §N3 — GrepSearch (新建 builtin/grep_search.rs)
        use super::super::registry::{ToolEntry, ToolError};

        #[derive(serde::Deserialize)]
        struct GrepSearchInput {
            pattern: String,
            #[serde(default)]
            path: Option<String>,
            #[serde(default)]
            glob: Option<String>,
            #[serde(default, rename = "output_mode")]
            output_mode: Option<String>,
            #[serde(default)]
            context: Option<usize>,
            #[serde(default)]
            head_limit: Option<usize>,
        }

        pub fn grep_search_tool_entry() -> ToolEntry {
            ToolEntry {
                name: "grep_search".to_string(),
                toolset: "read".to_string(),
                description: "Search file contents with a regex pattern.".to_string(),
                input_schema: serde_json::json!({
                    "type": "object",
                    "properties": {
                        "pattern": { "type": "string", "description": "Regex pattern to search for" },
                        "path": { "type": "string", "description": "Directory to search in" },
                        "glob": { "type": "string", "description": "Glob pattern to filter files" },
                        "output_mode": { "type": "string", "enum": ["content", "files_with_matches", "count"] },
                        "context": { "type": "integer", "minimum": 0, "description": "Context lines around match" },
                        "head_limit": { "type": "integer", "minimum": 1, "description": "Max results to return" }
                    },
                    "required": ["pattern"]
                }),
                max_result_size: Some(50 * 1024),
                timeout_secs: Some(10),
                disabled: false,
                handler: std::sync::Arc::new(|args, ctx| {
                    Box::pin(async move {
                        let input: GrepSearchInput = serde_json::from_value(args.clone())
                            .map_err(|e| ToolError::Handler(format!("Invalid input: {}", e)))?;
                        // 调用 ripgrep 或现有 Grep 工具
                        let _ = &ctx.workdir;
                        Ok("[grep_search result — implementation from GlobalToolRegistry]".to_string())
                    })
                }),
            }
        }

