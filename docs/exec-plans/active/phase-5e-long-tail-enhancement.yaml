    must_implement:
      - |
        // 08-critical-fix-priority.md §F13 — Agent ToolHandler (新建 builtin/agent.rs)
        use super::super::registry::{ToolEntry, ToolError};

        pub fn agent_tool_entry() -> ToolEntry {
            ToolEntry {
                name: "agent".to_string(),
                toolset: "utility".to_string(),
                description: "Delegate a task to a nested AI agent.".to_string(),
                input_schema: serde_json::json!({
                    "type": "object",
                    "properties": {
                        "task": { "type": "string", "description": "Task description for the nested agent" },
                        "context": { "type": "string", "description": "Optional context or background information" }
                    },
                    "required": ["task"]
                }),
                max_result_size: Some(10 * 1024),
                timeout_secs: Some(60),
                disabled: false,
                handler: std::sync::Arc::new(|args, _ctx| {
                    Box::pin(async move {
                        // 限制递归深度：通过环境变量或全局配置
                        let current_depth = std::env::var("IF2AI_AGENT_DEPTH")
                            .ok().and_then(|v| v.parse::<u32>().ok()).unwrap_or(0);
                        if current_depth >= 3 {
                            return Err(ToolError::Handler("Agent recursion depth limit exceeded".into()));
                        }

                        let _guard = std::env::var_os("IF2AI_AGENT_DEPTH")
                            .map(|_| Ok(()))
                            .unwrap_or_else(|| std::env::set_var("IF2AI_AGENT_DEPTH", "1"));
                        std::env::set_var("IF2AI_AGENT_DEPTH", format!("{}", current_depth + 1));

                        let task = args.get("task")
                            .and_then(|v| v.as_str())
                            .ok_or_else(|| ToolError::Handler("Missing 'task' argument".into()))?;
                        let context = args.get("context").and_then(|v| v.as_str()).unwrap_or("");

                        // 调用 start_agent_stream 或 run_agent_turn（同步阻塞）
                        // 返回结果
                        Ok(format!("[Agent result for: {}]", task))
                    })
                }),
            }
        }

      - |
        // 08-critical-fix-priority.md §F16 — 定期保存 session (agent.rs)
        // start_agent_stream 后台任务中：
        let mut token_count = 0;
        const SAVE_INTERVAL: u32 = 50;  // 每 50 个 token 保存一次

        // 在处理每个 token 后：
        token_count += 1;
        if token_count % SAVE_INTERVAL == 0 {
            let _ = session_manager.save_session(&session_id);
            tracing::debug!("[start_agent_stream] Periodic session save at token {}", token_count);
        }

        // 同时注册窗口关闭事件：
        // 在 Tauri setup 中：
        app_handle.on_window_event(move |event| {
            if matches!(event, tauri::WindowEvent::CloseRequested { .. }) {
                // 等待后台任务完成或取消
            }
        });

      - |
        // 08-critical-fix-priority.md §UI-6 — Session 恢复 ToolResult (App.tsx)
        // loadSession 时遍历 session messages：
        function parseSessionMessages(sessionMessages: any[]): Message[] {
          return sessionMessages.flatMap((msg) => {
            const blocks = msg.content || [];
            return blocks.flatMap((block: any) => {
              if (block.type === 'ToolResult') {
                return {
                  id: `tool-${block.tool_call_id || block.id}-${Date.now()}`,
                  role: 'tool' as const,
                  content: block.output || block.content || '',
                  timestamp: new Date(msg.timestamp || Date.now()),
                  toolCallId: block.tool_call_id || block.id,
                  toolName: block.tool_name || 'unknown',
                  isError: block.is_error || false,
                };
              }
              if (block.type === 'Text') {
                return {
                  id: `${msg.role}-${block.id || Date.now()}`,
                  role: msg.role as 'user' | 'assistant',
                  content: block.text,
                  timestamp: new Date(msg.timestamp || Date.now()),
                };
              }
              return [];
            });
          });
        }

