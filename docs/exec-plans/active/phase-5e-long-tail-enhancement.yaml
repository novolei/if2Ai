    baseline_ref: "rust/crates/tools/src/lib.rs (ToolSearch spec:424-437, ToolSearchInput:757-910, run_tool_search:910-1124)"

    current_state: |
      register_builtin_tools() 中没有 ToolSearch 工具。
      Baseline 的 ToolSearch 工具允许 Agent 搜索可用的工具名称和描述。
      ❌ MISSING — 新建 tool_search.rs 实现 ToolSearch ToolHandler

    must_implement:
      - |
        // 08-critical-fix-priority.md §F12 — ToolSearch ToolHandler (新建 tool_search.rs)
        use super::super::registry::{ToolEntry, ToolError};
        use super::super::context::SharedToolContext;
        use crate::modules::tools::ToolRegistry;

        pub fn tool_search_tool_entry(registry: Arc<ToolRegistry>) -> ToolEntry {
            ToolEntry {
                name: "tool_search".to_string(),
                toolset: "utility".to_string(),
                description: "Search for available tools by name or description.".to_string(),
                input_schema: serde_json::json!({
                    "type": "object",
                    "properties": {
                        "query": { "type": "string", "description": "Search query for tool name or description" }
                    },
                    "required": ["query"]
                }),
                max_result_size: Some(5 * 1024),
                timeout_secs: Some(5),
                disabled: false,
                handler: std::sync::Arc::new(move |args, _ctx| {
                    let registry_clone = registry.clone();
                    Box::pin(async move {
                        let query = args.get("query")
                            .and_then(|v| v.as_str())
                            .unwrap_or("")
                            .to_lowercase();
                        let definitions = registry_clone.get_definitions(None);
                        let results: Vec<_> = definitions.into_iter()
                            .filter_map(|def| {
                                let obj = def.as_object()?;
                                let func = obj.get("function")?.as_object()?;
                                let name = func.get("name")?.as_str()?.to_lowercase();
                                let desc = func.get("description").and_then(|d| d.as_str()).unwrap_or("").to_lowercase();
                                if query.is_empty() || name.contains(&query) || desc.contains(&query) {
                                    Some(def)
                                } else { None }
                            })
                            .collect();
                        serde_json::to_string_pretty(&results)
                            .map_err(|e| ToolError::Handler(e.to_string()))
                    })
                }),
            }
        }

      - |
        // mod.rs — register_builtin_tools() 中添加：
        if let Err(e) = registry.register(builtin::tool_search::tool_search_tool_entry(registry.clone())) {
            eprintln!("Failed to register tool_search tool: {}", e);
        }

