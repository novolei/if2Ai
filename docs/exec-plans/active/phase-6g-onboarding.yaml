# Phase 6G: Onboarding & Configuration Platform
# ─────────────────────────────────────────────────────────────────────────────
# 目标: 实现完整的 6 步 Onboarding 系统（前后端一体），包括状态机、配置持久化、
#       系统检测、Provider/Channel 配置测试、Agent 激活、UI 6 个 Step 页面。
# 优先级: P0 核心后端 → P1 前后端集成 → P2 UI 细节完善
# ─────────────────────────────────────────────────────────────────────────────

meta:
  phase: "6g"
  phase_status: draft
  title: "Onboarding & Configuration Platform — 6-Step State Machine + Full UI"
  owner: "@executor"
  depends_on_phase: "6bw"
  design_docs:
    - docs/design-docs/postCLI/ADR/ADR-014-if2AI-Onboarding.md
  backlog_refs:
    - "TASK-014-01 ~ TASK-014-18"
  execution_policy:
    human_checkpoint_required: false
    mandatory_code_reviewer_per_slice: true

slices:
  # ── MILESTONE 1: Infrastructure (Backend Core) ──

  - id: "6g.1"
    title: "P0: Onboarding State Machine + Persistence Store"
    status: done
    design_ref: "docs/design-docs/postCLI/ADR/ADR-014-if2AI-Onboarding.md"
    backlog_ref: "TASK-014-01"
    impl_targets:
      - src-tauri/src/modules/onboarding/mod.rs
      - src-tauri/src/modules/onboarding/state.rs
      - src-tauri/src/modules/onboarding/flow.rs
      - src-tauri/src/modules/onboarding/store.rs
    baseline_ref: "src-tauri/src/modules/onboarding/ 目录不存在"
    current_state: |
      Onboarding 模块完全不存在，需要从零创建。现有代码无状态机或 state.json 读写。
    must_implement:
      - "AppState / OnboardingStep / OnboardingState 类型定义 + Serialize/Deserialize"
      - "OnboardingStep::as_index() / from_index() 方法"
      - "OnboardingFlow::next_step() / prev_step() 状态转移逻辑"
      - "OnboardingStore::load() / save() 读写 ~/.if2ai/state.json"
      - "draft_configs + last_failure 中断恢复字段"
    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/modules/onboarding/state.rs"
        grep: "OnboardingState"
        label: "OnboardingState 存在"
      - type: symbol
        file: "src-tauri/src/modules/onboarding/state.rs"
        grep: "AppOnboardingState"
        label: "AppOnboardingState 存在"
      - type: symbol
        file: "src-tauri/src/modules/onboarding/state.rs"
        grep: "OnboardingStep"
        label: "OnboardingStep 存在"
      - type: symbol
        file: "src-tauri/src/modules/onboarding/flow.rs"
        grep: "next_step"
        label: "next_step 存在"
      - type: symbol
        file: "src-tauri/src/modules/onboarding/flow.rs"
        grep: "prev_step"
        label: "prev_step 存在"
      - type: test
        cmd: "RUST_TEST_THREADS=1 cargo test -p if2ai-backend modules::onboarding"
        expect: "all tests pass"
    review_checklist:
      - "next_step 是否检查前置条件（不可越级）"
      - "prev_step 是否边界安全（step 1 不可再回退）"
      - "state.json 序列化格式与 ADR 第 6.2 节一致"

  - id: "6g.2"
    title: "P0: ConfigService 双模式持久化 + Bridge"
    status: done
    design_ref: "docs/design-docs/postCLI/ADR/ADR-014-if2AI-Onboarding.md"
    backlog_ref: "TASK-014-02"
    impl_targets:
      - src-tauri/src/modules/config/mod.rs
      - src-tauri/src/modules/config/types.rs
      - src-tauri/src/modules/config/service.rs
      - src-tauri/src/modules/config/store.rs
      - src-tauri/src/modules/config/bridge.rs
      - src-tauri/src/modules/config/triple_files.rs
    baseline_ref: "ConfigService trait 在 ADR 中定义但未实现；现有代码无 ~/.if2ai/config.json 读写"
    current_state: |
      现有配置读取在 runtime/config.rs 中（Claw settings），Onboarding 需要独立的 ConfigService。
    must_implement:
      - "AppConfig / ProviderConfig / ChannelConfig / ModelSelection 类型"
      - "ConfigService::save_config() 写 Layer 1 (config.json) + Layer 2 (三文件) + Bridge (~/.claude/settings.json)"
      - "ConfigService::load_config() 读 Layer 1（带 version 字段）"
      - "ConfigService::validate_config() 校验完整性"
      - "ConfigService::reset_onboarding() 清空数据"
      - "bridge_to_claw_settings() 桥接 ANTHROPIC_API_KEY / OPENAI_API_KEY / model"
      - "providers.yaml + auth.json + models.json 同步写入"
      - "文件权限 0600，并发保护 tokio::sync::Mutex"
    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/modules/config/service.rs"
        grep: "ConfigService"
        label: "ConfigService struct 存在"
      - type: symbol
        file: "src-tauri/src/modules/config/service.rs"
        grep: "save_config"
        label: "save_config 存在"
      - type: symbol
        file: "src-tauri/src/modules/config/service.rs"
        grep: "load_config"
        label: "load_config 存在"
      - type: symbol
        file: "src-tauri/src/modules/config/service.rs"
        grep: "reset_onboarding"
        label: "reset_onboarding 存在"
      - type: symbol
        file: "src-tauri/src/modules/config/bridge.rs"
        grep: "bridge_to_claw_settings"
        label: "桥接逻辑存在"
      - type: test
        cmd: "RUST_TEST_THREADS=1 cargo test -p if2ai-backend modules::config"
        expect: "all tests pass"
    review_checklist:
      - "三写同步是否原子（任一失败不回滚）"
      - "桥接是否不覆盖已有 ~/.claude/settings.json 中无关字段"
      - "version 字段是否存在于 config.json"

