  # ───────────── Stage 2: ToolContext 传播机制 ───────────────────────────────

  - id: "4.2"
    title: "ToolContext Arc<Mutex> 机制 — 让工具函数访问 workdir"
    status: pending
    design_ref: "docs/design-docs/project-workdir-boundary.md"
    backlog_ref: "BL-402"
    impl_targets:
      - src-tauri/src/modules/tools/context.rs        # 必须新建
      - src-tauri/src/modules/tools/registry.rs       # MODIFY: ToolRegistry 持有 context
      - src-tauri/src/modules/tools/mod.rs            # MODIFY: 导出 context 模块
      - src-tauri/src/modules/runtime/config.rs       # MODIFY: RuntimeConfig 新增 workdir

    current_state: |
      ⚠️ 当前问题：工具函数无法访问当前的 workdir context
        - file_read 和 bash 需要知道当前 project 的 workdir
        - 目前没有机制传递这个信息给工具 handler
      ❌ MISSING — 必须新建 context.rs 并修改 3 个文件：
        1. tools/context.rs：ToolContext struct + thread_local 或 Arc<Mutex> 方案
        2. tools/registry.rs：Registry 持有 context，dispatch 时传入
        3. runtime/config.rs：RuntimeConfig 新增 workdir: Option<PathBuf>
      注意：采用 Arc<Mutex<ToolContext>> 方案，不使用 thread_local

    must_implement:
      - |
        // project-workdir-boundary.md §方案 B — 新建 context.rs
        use std::sync::{Arc, Mutex};
        use std::path::PathBuf;

        #[derive(Debug, Clone)]
        pub struct ToolContext {
            pub workdir: PathBuf,
            pub permission_mode: PermissionMode,
        }

        pub type SharedToolContext = Arc<Mutex<ToolContext>>;

        impl ToolContext {
            pub fn new(workdir: PathBuf, permission_mode: PermissionMode) -> Self {
                Self { workdir, permission_mode }
            }
        }
      - |
        // project-workdir-boundary.md §Registry 持有 context — 修改 registry.rs
        pub struct ToolRegistry {
            tools: Arc<DashMap<String, ToolEntry>>,
            context: SharedToolContext,  // ✅ 新增
        }

        impl ToolRegistry {
            pub fn new(context: SharedToolContext) -> Self {
                Self {
                    tools: Arc::new(DashMap::new()),
                    context,
                }
            }

            pub fn dispatch(&self, name: &str, args: &Value) -> Result<String, ToolError> {
                let entry = self.get(name).ok_or_else(||
                    ToolError::NotFound(name.to_string()))?;
                // 从 context 读取 workdir（用于工具执行）
                let ctx = self.context.lock().map_err(|e|
                    ToolError::Handler(format!("Context lock error: {}", e)))?;
                // 调用 handler 时传入 context
                (entry.handler)(args, &ctx)
            }
        }

        // ToolHandler 类型签名变更：
        pub type ToolHandler = Arc<
            dyn Fn(&Value, &ToolContext) ->
                Pin<Box<dyn std::future::Future<Output = Result<String, ToolError>> + Send>>
                + Send + Sync
        >;
      - |
        // project-workdir-boundary.md §RuntimeConfig — 修改 config.rs
        #[derive(Debug, Clone)]
        pub struct RuntimeConfig {
            pub workdir: Option<PathBuf>,       // ✅ 新增
            pub permission_mode: PermissionMode,
            pub max_turns: usize,
            pub max_tokens: u32,
        }

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/modules/tools/context.rs"
        grep: "pub struct ToolContext"
        label: "ToolContext struct — project-workdir-boundary.md §方案 B"
      - type: symbol
        file: "src-tauri/src/modules/tools/registry.rs"
        grep: "SharedToolContext"
        label: "Registry 持有 ToolContext"
      - type: symbol
        file: "src-tauri/src/modules/runtime/config.rs"
        grep: "workdir: Option<PathBuf>"
        label: "RuntimeConfig.workdir 字段存在"
      - type: test
        cmd: "cargo test -p if2ai-backend -- tools"
        expect: "all tests pass"
    review_checklist:
      - "context.rs 是否使用 Arc<Mutex<ToolContext>> 方案（不是 thread_local）"
      - "ToolHandler 类型签名是否包含 &ToolContext 参数"
      - "Registry.dispatch 是否在调用 handler 前获取 context lock"
