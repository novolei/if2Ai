      - "是否保留原有的危险命令 denylist"
      - "handler 签名是否为 async fn(Value, &ToolContext)"
      - "超时参数是否正确传递"
      - "无 unwrap()（测试除外）"

  # ───────────── Stage 4: 前端工具调用接口 ──────────────────────────────────

  - id: "4.5"
    title: "execute_tool Tauri 命令 — 前端直接调用工具"
    status: pending
    design_ref: "docs/design-docs/tool-activation.md"
    backlog_ref: "BL-405"
    impl_targets:
      - src-tauri/src/commands/tools.rs           # 必须新建
      - src-tauri/src/commands/mod.rs            # MODIFY: 注册新命令模块
      - src/lib/tauri.ts                         # MODIFY: 前端新增工具调用接口

    current_state: |
      ⚠️ 当前问题：前端无法直接触发工具调用，只能通过 Agent 间接使用
      ❌ MISSING — 必须新建 commands/tools.rs：
        1. execute_tool(name, args) → 直接执行工具
        2. list_tools() → 列出所有可用工具
        3. get_tool_definitions() → 获取 OpenAI 格式的工具定义
      注意：json_parse.rs 的 entry() 也要更新签名（接受 ToolContext）

    must_implement:
      - |
        // tool-activation.md §commands/tools.rs — 新建文件
        use crate::modules::tools::{ToolRegistry, ToolError};
        use tauri::State;
        use std::sync::Arc;

        #[tauri::command]
        pub async fn execute_tool(
            state: State<'_, AppState>,
            name: String,
            args: String,  // JSON string
        ) -> Result<String, String> {
            let args: serde_json::Value = serde_json::from_str(&args)
                .map_err(|e| format!("Invalid JSON args: {}", e))?;

            // 从当前 runtime context 获取 workdir（简化：使用 home dir）
            let workdir = std::env::var("HOME")
                .map(PathBuf::from)
                .unwrap_or_else(|_| PathBuf::from("."));
            let context = ToolContext::new(workdir, PermissionMode::WorkspaceWrite);

            state.tool_registry.dispatch(&name, &args, &context)
                .await
                .map_err(|e| e.to_string())
        }

        #[tauri::command]
        pub fn list_tools(
            state: State<'_, AppState>,
        ) -> Result<Vec<ToolDefinition>, String> {
            state.tool_registry.get_definitions(None)
                .map_err(|e| e.to_string())
        }

        #[tauri::command]
        pub fn get_tool_definitions(
            state: State<'_, AppState>,
            allowed: Option<Vec<String>>,
        ) -> Result<Vec<serde_json::Value>, String> {
            state.tool_registry.get_definitions(allowed)
                .map_err(|e| e.to_string())
        }
      - |
        // tool-activation.md §commands/mod.rs — 注册新模块
        pub mod tools;  // ✅ 新增

        // 在 lib.rs 或 main.rs 中注册命令：
        // .invoke_handler(tauri::generate_handler![
        //     commands::tools::execute_tool,
        //     commands::tools::list_tools,
        //     commands::tools::get_tool_definitions,
        // ])
      - |
        // tool-activation.md §lib/tauri.ts — 前端接口
        export interface ToolDefinition {
          name: string;
          description: string;
          input_schema: object;
        }

        export interface ToolCallResult {
          success: boolean;
          output?: string;
          error?: string;
        }

        export async function executeTool(
          name: string,
          args: Record<string, unknown>
        ): Promise<ToolCallResult> {
          try {
            const result = await invoke<string>('execute_tool', {
              name,
              args: JSON.stringify(args)
            });
            return { success: true, output: result };
          } catch (e) {
            return { success: false, error: String(e) };
          }
        }

        export async function listTools(): Promise<ToolDefinition[]> {
          return invoke<ToolDefinition[]>('list_tools');
        }

        export async function getToolDefinitions(
          allowed?: string[]
        ): Promise<object[]> {
          return invoke<object[]>('get_tool_definitions', { allowed });
        }

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/commands/tools.rs"
        grep: "pub async fn execute_tool"
