  # ───────────── Stage 3: 边界控制实现 ────────────────────────────────────

  - id: "4.3"
    title: "file_read 工具 — workdir allowlist 实现"
    status: pending
    design_ref: "docs/design-docs/project-workdir-boundary.md"
    backlog_ref: "BL-403"
    impl_targets:
      - src-tauri/src/modules/tools/builtin/file_read.rs  # MODIFY: 实现 allowlist

    current_state: |
      ⚠️ 当前问题：file_read 只有 denylist（/etc/passwd 等），可被绕过
        正确的做法：只允许访问 workdir 内的文件（allowlist）
      ❌ MISSING — file_read.rs 必须修改：
        1. dispatch 函数接收 ToolContext 参数
        2. 路径必须在 workdir 内（allowlist 检查）
        3. 保留原有的敏感路径 denylist 作为额外保护

    must_implement:
      - |
        // project-workdir-boundary.md §file_read — 修改 handler 签名和实现
        pub async fn execute_read_file(args: &Value, ctx: &ToolContext)
            -> Result<String, ToolError>
        {
            let path = args.get("path")
                .and_then(|v| v.as_str())
                .ok_or_else(|| ToolError::Handler("Missing 'path' argument".into()))?;

            // Allowlist 检查：路径必须在 workdir 内
            let requested_path = PathBuf::from(path);
            let canonical_path = requested_path.canonicalize()
                .map_err(|e| ToolError::Handler(format!("Invalid path: {}", e)))?;

            let canonical_workdir = ctx.workdir.canonicalize()
                .map_err(|e| ToolError::Handler(format!("Invalid workdir: {}", e)))?;

            if !canonical_path.starts_with(&canonical_workdir) {
                return Err(ToolError::Handler(format!(
                    "Path '{}' is outside allowed workdir '{}'",
                    path, ctx.workdir.display()
                )));
            }

            // 额外敏感路径检查（保留原有 denylist）
            let sensitive = ["/etc/passwd", "/etc/shadow", "/.ssh/", "/.aws/"];
            let path_str = path.to_string();
            for pat in sensitive {
                if path_str.contains(pat) {
                    return Err(ToolError::Handler(
                        format!("Access to '{}' is forbidden", pat)
                    ));
                }
            }

            // 执行读取
            let offset = args.get("offset").and_then(|v| v.as_u64());
            let limit = args.get("limit").and_then(|v| v.as_u64());
            execute_read_file_internal(&canonical_path, offset, limit).await
        }

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/modules/tools/builtin/file_read.rs"
        grep: "starts_with.*workdir"
        label: "file_read 有 workdir allowlist 检查"
      - type: symbol
        file: "src-tauri/src/modules/tools/builtin/file_read.rs"
        grep: "ToolContext"
        label: "handler 签名包含 ToolContext 参数"
      - type: test
        cmd: "cargo test -p if2ai-backend -- tools::builtin"
        expect: "all tests pass"
    review_checklist:
      - "是否检查路径是否在 workdir 内（canonicalize 后比较）"
      - "是否保留原有的敏感路径 denylist"
      - "handler 签名是否为 async fn(Value, &ToolContext)"
      - "错误消息是否包含实际路径和允许的 workdir"
      - "无 unwrap()（测试除外）"

  - id: "4.4"
    title: "bash 工具 — workdir 限制实现"
    status: pending
    design_ref: "docs/design-docs/project-workdir-boundary.md"
    backlog_ref: "BL-404"
    impl_targets:
      - src-tauri/src/modules/tools/builtin/bash.rs    # MODIFY: 实现 workdir 限制

    current_state: |
      ⚠️ 当前问题：bash 直接在 host 环境执行任意命令，无 workdir 限制
      ❌ MISSING — bash.rs 必须修改：
        1. dispatch 函数接收 ToolContext 参数
        2. 命令前强制添加 cd $workdir &&
        3. 保留原有的危险命令 denylist

    must_implement:
      - |
        // project-workdir-boundary.md §bash — 修改 handler 签名和实现
        pub async fn execute_bash(args: &Value, ctx: &ToolContext)
            -> Result<String, ToolError>
        {
            let command = args.get("command")
                .and_then(|v| v.as_str())
                .ok_or_else(|| ToolError::Handler("Missing 'command' argument".into()))?;

            let timeout = args.get("timeout")
                .and_then(|v| v.as_u64())
                .unwrap_or(30);

            // 危险命令检查（保留原有 denylist）
            let dangerous = ["rm -rf /", "rm -rf /*", "sudo su", "mkfs", ":(){:|:&};"];
            for pat in dangerous {
                if command.contains(pat) {
                    return Err(ToolError::Handler(
                        format!("Command '{}' is forbidden", pat)
                    ));
                }
            }

            // Workdir 限制：强制在 workdir 内执行
            let wrapped = format!("cd {} && {}", ctx.workdir.display(), command);
            execute_bash_internal(&wrapped, timeout).await
        }

    acceptance:
