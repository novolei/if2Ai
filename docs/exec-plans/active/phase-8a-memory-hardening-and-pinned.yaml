      - "src-tauri/src/modules/memory/job_runner.rs — pub struct JobRunner { db: Arc<Mutex<Connection>>, max_retries: u32, max_concurrent: usize }"
      - "src-tauri/src/modules/memory/job_runner.rs — pub struct JobAttempt { job_kind, job_target, attempt, last_error, last_attempt_at, status: JobStatus }"
      - "src-tauri/src/modules/memory/job_runner.rs — pub enum JobStatus { Active, Skipped, Done }"
      - "src-tauri/src/modules/memory/job_runner.rs — SQL: CREATE TABLE IF NOT EXISTS job_attempts (job_kind TEXT, job_target TEXT, attempt INTEGER, last_error TEXT, last_attempt_at TEXT, status TEXT, PRIMARY KEY (job_kind, job_target))"
      - "src-tauri/src/modules/memory/job_runner.rs — impl JobRunner { pub async fn run<F, Fut, T>(&self, kind: &str, target: &str, f: F) -> Result<Option<T>, JobError> where F: FnOnce() -> Fut, Fut: Future<Output = Result<T, anyhow::Error>> }"
