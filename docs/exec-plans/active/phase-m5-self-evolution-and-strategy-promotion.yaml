# Phase M5: Self Evolution And Strategy Promotion
# ─────────────────────────────────────────────────────────────────────────────
# 基于 memory + reflection + harness compare，建立 candidate strategy ->
# eval -> promote/hold/reject 的自我进化闭环。
# ─────────────────────────────────────────────────────────────────────────────

meta:
  phase: "m5"
  phase_status: proposed
  title: "Self Evolution And Strategy Promotion"
  owner: "@executor"
  depends_on_phase: "m4"
  execution_runbook: "docs/exec-plans/active/phase-m5-executor-runbook.md"
  design_docs:
    - docs/staff-remediation/if2ai-staff-remediation-blueprint.md
    - docs/staff-remediation/memory-self-evolution-design.md
    - docs/staff-remediation/harness-v2-governance-design.md
    - docs/staff-remediation/remediation-program-and-phase-roadmap.md
    - docs/exec-plans/active/phase-m5-executor-runbook.md
  human_checkpoints:
    - after_slice: "m5.2"
    - after_slice: "m5.5"
    - after_slice: "m5.8"

slices:

  - id: "m5.1"
    title: "Introduce trajectory scoring model"
    status: pending
    design_ref: "docs/staff-remediation/memory-self-evolution-design.md"
    impl_targets:
      - src-tauri/src/modules/learning/
      - src-tauri/src/modules/memory/
    must_implement:
      - "定义 trajectory scoring 入口"
      - "让 run outcome、grader failures、memory events 能参与评分"
      - "输出可比较的 trajectory score"
    acceptance:
      - type: compile
        cmd: "cargo check --manifest-path src-tauri/Cargo.toml"
    review_checklist:
      - "trajectory score 不能只是 token/latency 分数"
      - "应能体现完成率、恢复质量、memory 对齐"

  - id: "m5.2"
    title: "Introduce failure clustering pipeline"
    status: pending
    design_ref: "docs/staff-remediation/memory-self-evolution-design.md"
    impl_targets:
      - src-tauri/src/modules/learning/
      - src-tauri/src/modules/harness/
    must_implement:
      - "把 recurring failures 聚类"
      - "区分 intent miss / policy issue / memory issue / recovery issue / tool misuse 等类别"
      - "让 reflection 可以消费 cluster 结果"
    acceptance:
      - type: manual
        text: "failure taxonomy 与 clustering 结构审查通过"
    review_checklist:
      - "clustering 结果必须可用于 candidate generation"
      - "分类不得仅依赖自然语言错误串"

  - id: "m5.3"
    title: "Generate structured reflection notes from runs"
    status: pending
    design_ref: "docs/staff-remediation/memory-self-evolution-design.md"
    impl_targets:
      - src-tauri/src/modules/learning/
    must_implement:
      - "从 trace/outcome/grader failures 生成结构化 reflection notes"
      - "至少包含 issue_type / evidence / proposed_strategy / expected_gain / risk_level"
      - "与 M3 reflection seam 对齐"
    acceptance:
      - type: compile
        cmd: "cargo check --manifest-path src-tauri/Cargo.toml"
    review_checklist:
      - "reflection 不得直接改 active policy"
      - "必须引用可追踪 evidence"

  - id: "m5.4"
    title: "Introduce candidate strategy registry"
    status: pending
    design_ref: "docs/staff-remediation/memory-self-evolution-design.md"
    impl_targets:
      - src-tauri/src/modules/learning/
      - src-tauri/src/modules/harness/
    must_implement:
      - "建立 candidate strategy 注册模型"
      - "标记 rollout_state: draft / candidate / active / rollback"
      - "关联来源：reflection / human feedback / curated rule"
    acceptance:
      - type: manual
        text: "candidate strategy registry 结构人工审查通过"
    review_checklist:
      - "strategy registry 必须可审计"
      - "active/candidate/rollback 边界必须清晰"

  - id: "m5.5"
    title: "Run offline eval for candidate strategies"
    status: pending
    design_ref: "docs/staff-remediation/harness-v2-governance-design.md"
    impl_targets:
      - harness/
      - src-tauri/src/modules/harness/
      - src-tauri/src/modules/learning/
    must_implement:
      - "candidate strategy 必须通过 harness compare"
      - "输出 promote / hold / reject recommendation"
      - "形成 offline eval 执行路径"
    acceptance:
      - type: manual
        text: "至少一条 candidate strategy 可完成 offline compare 评估"
    review_checklist:
      - "无 compare 不可 promote"
      - "至少覆盖 prompt / memory / policy 中的一类 strategy"

  - id: "m5.6"
    title: "Implement gated promotion and rollback semantics"
    status: pending
    design_ref: "docs/staff-remediation/memory-self-evolution-design.md"
    impl_targets:
      - src-tauri/src/modules/learning/
      - src-tauri/src/modules/harness/
    must_implement:
      - "candidate -> active 的 promote 需走 gate"
      - "支持 rollback_reason 与 rollback path"
      - "禁止单次成功样本直接升默认"
    acceptance:
      - type: manual
        text: "promotion/rollback 语义与 gate 规则人工审查通过"
    review_checklist:
      - "gated promotion 必须复用 M4 gate 规则"
      - "rollback 不能停留在文档描述"

  - id: "m5.7"
    title: "Project strategy lifecycle into diagnostics surfaces"
    status: pending
    design_ref: "docs/staff-remediation/memory-self-evolution-design.md"
    impl_targets:
      - src/modules/settings/
      - src/components/chat/
      - src/state/
    must_implement:
      - "展示 candidate / active / rollback 状态"
      - "展示 strategy 来源、compare 结果、最近 recommendation"
      - "让 diagnostics 页面可见 recall gain / failure notes / suppression"
    acceptance:
      - type: compile
        cmd: "npm run build:web"
    review_checklist:
      - "自我进化面必须是治理面，不是营销面"
      - "信息来源必须对齐实际 evaluator 输出"

  - id: "m5.8"
    title: "Add self-evolution safety and regression checks"
    status: pending
    design_ref: "docs/staff-remediation/memory-self-evolution-design.md"
    impl_targets:
      - src-tauri/src/modules/learning/
      - src-tauri/src/integration_tests.rs
      - harness/
    must_implement:
      - "补充 strategy registry / promote / rollback / candidate generation 测试"
      - "覆盖至少一条错误推广被 gate 拦下的场景"
    acceptance:
      - type: manual
        text: "self-evolution safety checks 人工抽查通过"
    review_checklist:
      - "必须证明‘会学习’不会变成‘随机漂移’"
      - "至少一条 reject path 必须有测试或回放案例"

notes: |
  Phase M5 的目标不是让系统“自动乱改自己”，而是建立可治理的策略演进闭环。
  执行者必须先读取 `docs/exec-plans/active/phase-m5-executor-runbook.md`，
  再开始任何 slice。
  完成标准是：
  1. candidate strategy registry 出现
  2. reflection -> candidate -> compare -> promote/hold/reject 形成闭环
  3. rollback 语义清晰且受 harness gate 约束
