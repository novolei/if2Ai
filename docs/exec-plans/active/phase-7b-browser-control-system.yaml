      - "chrome_finder::find_chrome_binary() 在 macOS 上能找到 /Applications/Google Chrome.app"
      - "BrowserError 实现 std::error::Error + Display"
      - "base64 版本冲突处理（统一到 0.22 或使用 features 解决）"

    review_checklist:
      - "chromiumoxide features 仅开启 tokio，不开启不需要的 features"
