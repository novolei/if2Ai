      - "无 unwrap()"

  # ─────────────────────────────────────────────────────────────
  # Slice 7B.2: BrowserSession + BrowserRegistry 核心实现
  # ─────────────────────────────────────────────────────────────
  - id: "7B.2"
    name: "BrowserSession + BrowserRegistry 核心"
    status: done
    priority: P0
    design_ref: docs/design-docs/postCLI/browser-control-system.md §3.1.1, §3.1.2
    estimated_days: 3
    depends_on: ["7B.1"]

    current_state: |
      browser 模块已建立（7B.1），但无 BrowserSession / BrowserRegistry 实现。

    must_implement:
      - "BrowserSession struct { session_id, browser, _handler, page, current_url, action_log }"
      - "ActionLogEntry struct { ts, action, params, result, url }"
      - "BrowserSession::new(session_id, config_path) -> Result<Self> — 用 BrowserConfig::builder().with_head(false).build() 启动 headless Chrome"
      - "BrowserSession::close(&mut self) -> Result<()>"
      - "BrowserSession::navigate(&mut self, url) -> Result<NavigateResult> — 导航并等待 domcontentloaded"
      - "BrowserSession::screenshot(&self) -> Result<String> — 全页 JPEG base64"
      - "BrowserSession::thumbnail(&self) -> Result<String> — 小尺寸 JPEG base64 (scale 0.15)"
      - "BrowserSession::click(&mut self, ref_num: u32) -> Result<String> — 通过 querySelector('[data-if2ai-ref=\"N\"]') 点击"
      - "BrowserSession::type_text(&mut self, text, ref_num, press_enter) -> Result<String>"
      - "BrowserSession::scroll(&mut self, direction: ScrollDir, amount: u32) -> Result<String>"
      - "BrowserSession::select_option(&mut self, ref_num: u32, value: &str) -> Result<String>"
      - "BrowserSession::press_key(&mut self, key: &str) -> Result<String>"
      - "BrowserSession::wait(&mut self, timeout_ms: u64, state: &str) -> Result<String>"
      - "BrowserSession::evaluate(&self, expr: &str) -> Result<String>"
      - "NavigateResult struct { url: String, title: String, snapshot: String }"
      - "ScrollDir enum { Up, Down }"
      - "BrowserRegistry struct — DashMap<String, BrowserSession>"
      - "BrowserRegistry::new(cold_state_path: PathBuf) -> Self"
      - "BrowserRegistry 暴露与 BrowserSession 相同接口的委托方法，接收 session_id 参数"
      - "BrowserRegistry 作为 Tauri managed state: Arc<BrowserRegistry>"

    impl_targets:
      - src-tauri/src/modules/browser/session.rs
      - src-tauri/src/modules/browser/registry.rs
      - src-tauri/src/modules/browser/mod.rs

    acceptance:
      - "cargo test modules::browser"
      - "集成测试：launch → navigate(https://example.com) → snapshot 返回含 [1] [2]... ref 的文本"
      - "集成测试：click(1) 返回新 snapshot"
      - "集成测试：screenshot() 返回非空 base64 字符串"
      - "两个不同 session_id 的 BrowserSession 在 DashMap 中独立共存"

    review_checklist:
      - "BrowserSession 和 BrowserRegistry 所有公开函数有 doc 注释"
      - "无 unwrap()/expect()（测试除外）"
      - "chromiumoxide handler JoinHandle 正确 spawn（不 await，避免阻塞）"
      - "close() 实现后 DashMap entry 被移除"
      - "navigate() 后自动调用 snapshot() 并将快照写入 NavigateResult.snapshot"

  # ─────────────────────────────────────────────────────────────
  # Slice 7B.3: DOM AXTree 快照算法移植
  # ─────────────────────────────────────────────────────────────
  - id: "7B.3"
    name: "DOM AXTree 快照算法 (snapshot.js 移植)"
    status: pending
    priority: P0
    design_ref: docs/design-docs/postCLI/browser-control-system.md §4
    estimated_days: 2
    depends_on: ["7B.2"]

    current_state: |
      BrowserSession 有 evaluate() 能力，但无 snapshot.js 脚本。
      openhanako 的 SNAPSHOT_SCRIPT 在 desktop/main.cjs 第 997-1130 行，
      已验证可工作的 DOM 遍历 + ref 注入 + 同构兄弟压缩算法。

    must_implement:
      - "src-tauri/src/modules/browser/snapshot.js — 完整移植 openhanako SNAPSHOT_SCRIPT，将 data-hana-ref 改为 data-if2ai-ref"
      - "snapshot.js 返回格式: { text: string, currentUrl: string, title: string }"
      - "snapshot.js 保留同构兄弟压缩逻辑（连续 >=3 个结构相同兄弟 compact 为单行）"
      - "snapshot.js 字符上限 30k，头尾截断"
      - "snapshot.rs — pub const SNAPSHOT_SCRIPT: &str = include_str!(\"snapshot.js\")"
      - "BrowserSession::snapshot(&self) -> Result<String> — 调用 page.evaluate(SNAPSHOT_SCRIPT) 并解析返回的 JSON text 字段"
      - "BrowserSession 中所有返回 snapshot 的方法（navigate, click, type_text, scroll, select_option, press_key, wait）使用 snapshot() 获取并在操作后刷新"

    impl_targets:
      - src-tauri/src/modules/browser/snapshot.js
      - src-tauri/src/modules/browser/snapshot.rs
      - src-tauri/src/modules/browser/session.rs

    acceptance:
      - "cargo test browser::snapshot"
      - "对 https://example.com 执行 snapshot()，返回文本包含 [1] 等 ref 编号"
      - "可交互元素（链接、按钮、输入框）在快照中有对应 ref"
      - "DOM 上确实被注入了 data-if2ai-ref 属性（可通过后续 querySelector 验证）"
      - "连续列表项（>=3 个同构兄弟）被压缩为单行格式"
      - "快照字符数不超过 30000"

    review_checklist:
      - "snapshot.js 中 data-hana-ref 全部替换为 data-if2ai-ref，无遗漏"
      - "snapshot.rs 使用 include_str! 嵌入 JS，不在运行时读文件"
      - "evaluate() 返回的 JSON 解析有正确错误处理，不 panic"
      - "snapshot() 每次调用前先清除旧 data-if2ai-ref 属性"

