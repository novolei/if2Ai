  - id: "7B.7"
    name: "Session 隔离完善 + 冷保存/恢复"
    status: pending
    priority: P1
    design_ref: docs/design-docs/postCLI/browser-control-system.md §7, §8
    estimated_days: 1.5
    depends_on: ["7B.6"]

    current_state: |
