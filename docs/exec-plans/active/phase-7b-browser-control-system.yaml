      - "chromiumoxide incognito context 确认：使用 Browser::new_context() 为每个 session 创建独立 context，隔离 cookie/localStorage"
      - "BrowserSession 持有 BrowserContext 引用（而非直接 Browser 引用），确保真正 session 隔离"

    impl_targets:
