      - src-tauri/src/modules/tools/builtin/mod.rs

    acceptance:
      - "cargo test browser_tool"
      - "AI 发出 tool_call {name: browser, action: start} 后浏览器启动"
      - "AI 发出 tool_call {name: browser, action: navigate, url: https://example.com} 后返回含快照的文本"
      - "AI 发出 tool_call {name: browser, action: screenshot} 后返回 image content block"
