      - type: test
        cmd: "cargo test -p if2ai-backend -- modules::runtime::conversation"
        expect: "all tests pass"
      - type: compile
        cmd: "cargo clippy --workspace --all-targets -- -D warnings"
    review_checklist:
      - "所有 conversation.rs 测试是否编译通过"
      - "StaticToolExecutor::get_definitions() 是否返回空 Vec"
      - "harness suite 是否存在"
