      - harness/suites/phase5a_integration.yaml           # CREATE: 行为测试

    baseline_ref: "rust/crates/runtime/src/conversation.rs (测试用例:565-614)"

    current_state: |
      conversation.rs 的测试使用 StaticToolExecutor 实现了 ToolExecutor trait。
      由于 trait 新增了 get_definitions() 方法，StaticToolExecutor 也必须实现。
      ❌ MISSING — StaticToolExecutor 需要实现 get_definitions()（返回空 Vec 即可），
      测试才能编译通过。

    must_implement:
      - |
        // conversation.rs — StaticToolExecutor 扩展
        impl ToolExecutor for StaticToolExecutor {
            fn execute(&mut self, tool_name: &str, input: &str) -> Result<String, ToolError> { ... }
            fn get_definitions(&self) -> Vec<ToolDefinition> {
                Vec::new()  // StaticToolExecutor 没有工具定义
