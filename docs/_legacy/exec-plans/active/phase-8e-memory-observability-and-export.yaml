  # ─────────────────────────────────────────────────────────────
  # Slice 8E.3: T-H3 — 日志关键词 grep 化规范
  # ─────────────────────────────────────────────────────────────
  - id: "8E.3"
    title: "T-H3 — 日志规范（[memory:{kind}:{target}] 统一格式）"
    status: pending
    priority: P2
    design_ref: >
      docs/design-docs/postCLI/memory-enhancement-from-openhanako-v1.md
      §Sprint 5 / T-H3
    estimated_days: 0.5

    current_state: |
      8A-8D 各模块的 tracing 日志格式不统一，无法用 grep '[memory:' 快速定位。
      ❌ MISSING：统一日志格式约定的落地（各 background job 开始/结束/失败时的标准日志）

    must_implement:
      - "约定日志格式：tracing::info!('[memory:{kind}:{target}] {phase} {msg}')（kind=job_kind, target=session_id/scope）"
      - "job_runner.rs run() — 开始时 tracing::info!('[memory:{kind}:{target}] start')，成功时 info!(' done {elapsed}ms')，失败时 error!(' fail attempt={} err={}')"
      - "rolling.rs — rolling_summary 开始/完成各一行 '[memory:rolling:{session_id}] ...' 格式"
      - "ticker.rs — do_daily 每个 DailyStep 开始/结束一行"
      - "compiler/today.rs + week.rs + longterm.rs + facts.rs — 编译开始/Skipped/完成各一行"
      - "extractor.rs — process_one 开始/提取数量/失败各一行"
      - "writer.rs — write_diary 开始/完成各一行"

    impl_targets:
      - src-tauri/src/modules/memory/job_runner.rs
      - src-tauri/src/modules/memory/summary/rolling.rs
      - src-tauri/src/modules/memory/ticker.rs
      - src-tauri/src/modules/memory/compiler/today.rs
      - src-tauri/src/modules/memory/compiler/week.rs
      - src-tauri/src/modules/memory/compiler/longterm.rs
      - src-tauri/src/modules/memory/compiler/facts.rs
      - src-tauri/src/modules/memory/facts/extractor.rs
      - src-tauri/src/modules/diary/writer.rs

    acceptance:
      - "grep '[memory:' $(cargo run 2>&1) 能命中各 background job 的关键日志"
      - "所有关键路径有 info! 开始 + info!/error! 结束"
      - "日志 target 字段（session_id / scope key）在每条日志可见"

    review_checklist:
      - "tracing 字段用 ? 前缀（?err）自动实现 Debug 格式化"
      - "不在 hot path 上调 format!（tracing 的懒求值特性）"
      - "不记录 PII（summary 内容不进日志，只记录 chars / session_id）"
      - "日志级别分明：开始/结束用 info!，失败用 error!，跳过用 debug!"
      - "无 unwrap()"

