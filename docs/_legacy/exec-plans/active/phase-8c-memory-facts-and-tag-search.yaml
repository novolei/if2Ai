      - "cargo test memory::facts::store::tests::tag_search_date_filter — 日期过滤排除范围外数据"
      - "cargo test memory::facts::store::tests::fts_rank — FTS 搜索按 rank 排序"
      - "cargo test memory::facts::store::tests::empty_tags_returns_empty — tags=[] 返回空列表"
      - "harness suite harness/suites/memory_facts_search.yaml 全通过"

    review_checklist:
