      - "SQL 参数绑定用 named params（:tag0, :tag1），不拼字符串"
      - "scope WHERE 子句用括号包裹避免 AND/OR 优先级问题"
      - "FTS match 用 fts5 的 MATCH 语法，query 需转义特殊字符"
