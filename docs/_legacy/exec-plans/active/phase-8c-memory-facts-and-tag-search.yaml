    must_implement:
      - "store.rs — pub struct DateRange { pub from: Option<DateTime<Utc>>, pub to: Option<DateTime<Utc>> }"
      - "search_by_tags SQL：SELECT f.*, COUNT(DISTINCT je.value) as match_count FROM facts f, json_each(f.tags) je WHERE je.value IN (...) GROUP BY f.id ORDER BY match_count DESC, f.time DESC LIMIT :limit"
      - "日期过滤：date_range.from → AND f.time >= :date_from；date_range.to → AND f.time <= :date_to"
      - "scope 过滤：复用 build_scope_where('f.scope', 'f.session_id', 'f.project_id', scope)"
      - "tags 为空时返回 Ok(vec![])（不执行 SQL）"
      - "search_full_text SQL：SELECT f.* FROM facts f JOIN facts_fts fts ON f.id = fts.rowid WHERE facts_fts MATCH :query ORDER BY rank LIMIT :limit"
      - "retrieval_planner（既有）：query 含 '[tag:xxx]' 模式时优先选 search_memory_by_tag（§0.5 Δ-19）"

    impl_targets:
      - src-tauri/src/modules/memory/facts/store.rs

    acceptance:
