      - |
        // 08-critical-fix-priority.md §F4 — TauriPermissionPrompter 完整实现
        // 在 agent.rs 或新建 commands/permission_prompter.rs：

        use std::sync::mpsc::{channel, Sender, Receiver};
        use crate::modules::runtime::permissions::{PermissionPrompter, PermissionPromptDecision, PermissionRequest};

        /// TauriPermissionPrompter 通过 window.emit() 向前端发送权限确认事件，
        /// 然后通过 std::sync::mpsc::Receiver 阻塞等待前端返回用户决定。
        /// 注意：run_turn() 是同步方法，使用 mpsc::Receiver 阻塞等待是合理的。
        pub struct TauriPermissionPrompter {
            window: tauri::WebviewWindow,
            sender: Sender<PermissionPromptDecision>,
            receiver: Receiver<PermissionPromptDecision>,
        }

        impl TauriPermissionPrompter {
            pub fn new(window: tauri::WebviewWindow) -> Self {
                let (sender, receiver) = channel();
                Self { window, sender, receiver }
            }

            /// 将 sender clone 给外部，外部在收到前端响应后调用 sender.send()
            pub fn sender(&self) -> Sender<PermissionPromptDecision> {
                self.sender.clone()
            }
        }

        impl PermissionPrompter for TauriPermissionPrompter {
            fn decide(&mut self, request: &PermissionRequest) -> PermissionPromptDecision {
                // 1. emit 确认事件给前端
                let _ = self.window.emit("permission-request", serde_json::json!({
                    "tool_name": request.tool_name,
                    "permission_mode": request.required_mode,
                    "message": request.message,
                }));

                // 2. 阻塞等待前端返回（mpsc::Receiver 阻塞当前线程）
                // 注意：run_turn() 本身是同步方法，所以这里阻塞是合理的
                // 如果 run_turn 在 tokio::spawn 中运行，需要用 tokio::task::block_in_place
                match self.receiver.recv_timeout(std::time::Duration::from_secs(60)) {
                    Ok(decision) => decision,
                    Err(_) => PermissionPromptDecision::Deny,  // 超时默认拒绝
                }
            }
        }

        // 前端侧（App.tsx）：
        // listen('permission-request', (event) => {
        //   const confirmed = window.confirm(`Allow ${event.payload.tool_name}?`);
        //   invoke('respond_permission', {
        //     sessionId: activeSessionId,
        //     decision: confirmed ? 'allow' : 'deny'
        //   });
        // });

      - |
        // Tauri command: respond_permission — 前端返回用户决定
        #[tauri::command]
        pub fn respond_permission(
            state: State<'_, AppState>,
            session_id: String,
            decision: String,
        ) -> Result<(), String> {
            let decision_enum = match decision.as_str() {
                "allow" => PermissionPromptDecision::Allow,
                _ => PermissionPromptDecision::Deny,
            };
            // 查找对应 session 的 TauriPermissionPrompter sender 并发送
            // 需要通过 AppState 存储 sender 映射
            state.permission_senders.lock().unwrap()
                .get(&session_id)
                .map(|s| s.send(decision_enum))
                .ok_or_else(|| "No pending permission request".to_string())?
                .map_err(|_| "Failed to send decision".to_string())
        }

