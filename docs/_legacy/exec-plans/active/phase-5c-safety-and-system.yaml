    must_implement:
      - |
        // 08-critical-fix-priority.md §F14 — SkillSearch ToolHandler (新建 skill_search.rs)
        use super::super::registry::{ToolEntry, ToolError};
        use super::skill::discover_skill_roots;
        use super::skill::parse_skill_frontmatter;

        pub fn skill_search_tool_entry() -> ToolEntry {
            ToolEntry {
                name: "skill_search".to_string(),
                toolset: "utility".to_string(),
                description: "Search for available skills by name or description.".to_string(),
                input_schema: serde_json::json!({
                    "type": "object",
                    "properties": {
                        "query": { "type": "string", "description": "Search query for skill name or description" }
                    },
                    "required": ["query"]
                }),
                max_result_size: Some(5 * 1024),
                timeout_secs: Some(5),
                disabled: false,
                handler: std::sync::Arc::new(|args, ctx| {
                    Box::pin(async move {
                        let query = args.get("query")
                            .and_then(|v| v.as_str())
                            .unwrap_or("")
                            .to_lowercase();
                        let workdir = &ctx.workdir;
                        let roots = discover_skill_roots(workdir);
                        let mut results = Vec::new();
                        for root in roots {
                            if let Ok(entries) = std::fs::read_dir(&root) {
                                for entry in entries.flatten() {
                                    let skill_md = entry.path().join("SKILL.md");
                                    if skill_md.is_file() {
                                        if let Ok(content) = std::fs::read_to_string(&skill_md) {
                                            let meta = parse_skill_frontmatter(&content);
                                            let name = meta.name.unwrap_or_else(|| entry.file_name().to_string_lossy().into_owned());
                                            let desc = meta.description.unwrap_or_default();
                                            if query.is_empty() || name.to_lowercase().contains(&query) || desc.to_lowercase().contains(&query) {
                                                results.push(serde_json::json!({
                                                    "name": name,
                                                    "description": desc,
                                                    "path": entry.path().to_string_lossy().to_string()
                                                }));
                                            }
                                        }
                                    }
                                }
                            }
                        }
                        serde_json::to_string_pretty(&results)
                            .map_err(|e| ToolError::Handler(e.to_string()))
                    })
                }),
            }
        }

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
