    status: done
    design_ref: "docs/bs_gap/08-critical-fix-priority.md"
    backlog_ref: "F6"
    impl_targets:
      - src-tauri/src/modules/tools/builtin/skill.rs    # CREATE: Skill ToolHandler
      - src-tauri/src/modules/tools/mod.rs              # MODIFY: 注册 Skill 工具

    baseline_ref: "rust/crates/tools/src/lib.rs (Skill spec:393-406, run_skill:714-755, discover_skill_roots:757-789); 08-critical-fix-priority.md §N3 (Skill 为 GlobalToolRegistry 迁移工具，阶段 2)"

    current_state: |
      【方案 A 全量迁移 — 阶段 2】
      Skill 是 GlobalToolRegistry 的 19 个工具之一。按照 N3 迁移计划：
        - 阶段 1 (5c.2): TodoWrite 路径验证 ✅
        - 阶段 2 (5c.4 当前): Skill 工具迁移
        - 阶段 3 (5e.6): 剩余 8 个独有工具 + 8 个重叠工具替换
      register_builtin_tools() 中没有 Skill 工具。
      Baseline 的 discover_skill_roots() 使用 env::var("CODEX_HOME")，
      If2Ai 应改为 IF2AI_HOME 或 ~/.if2ai/skills/。
      ❌ MISSING — 新建 skill.rs 实现 Skill ToolHandler，包含：
        1. discover_skill_roots(workdir) — 搜索多个路径
        2. resolve_skill_path(skill_name, workdir) — 找到 SKILL.md 文件
        3. run_skill(input, ctx) — 读取并返回 Skill 内容
        4. skill_tool_entry() — ToolEntry 构造

    must_implement:
      - |
        // 08-critical-fix-priority.md §F6 — Skill ToolHandler (新建 skill.rs)
        use super::super::registry::{ToolEntry, ToolError};
        use super::super::context::SharedToolContext;

        pub fn skill_tool_entry() -> ToolEntry {
            ToolEntry {
                name: "skill".to_string(),
                toolset: "utility".to_string(),
                description: "Load and execute a custom skill by name.".to_string(),
                input_schema: serde_json::json!({
                    "type": "object",
                    "properties": {
                        "skill": { "type": "string", "description": "Skill name (directory name)" }
                    },
                    "required": ["skill"]
                }),
                max_result_size: Some(50 * 1024),
                timeout_secs: Some(10),
                disabled: false,
                handler: std::sync::Arc::new(|args, ctx| {
                    Box::pin(async move {
                        let skill = args.get("skill")
                            .and_then(|v| v.as_str())
                            .ok_or_else(|| ToolError::Handler("Missing 'skill' argument".into()))?;
                        let skill_path = resolve_skill_path(skill, &ctx.workdir)
                            .map_err(ToolError::Handler)?;
                        let content = tokio::fs::read_to_string(&skill_path).await
                            .map_err(|e| ToolError::Handler(format!("Failed to read skill file: {}", e)))?;
                        Ok(content)
                    })
                }),
            }
        }

        fn resolve_skill_path(skill: &str, workdir: &std::path::Path) -> Result<std::path::PathBuf, String> {
            let roots = discover_skill_roots(workdir);
            for root in roots {
                let candidate = root.join(skill).join("SKILL.md");
                if candidate.is_file() { return Ok(candidate); }
                let legacy = root.join(format!("{skill}.md"));
                if legacy.is_file() { return Ok(legacy); }
            }
            Err(format!("Skill '{}' not found in any search path", skill))
        }

        fn discover_skill_roots(workdir: &std::path::Path) -> Vec<std::path::PathBuf> {
            let mut roots = Vec::new();
            // 项目级
            for dir in &[".if2ai/skills", ".claw/skills", ".codex/skills",
                         ".if2ai/commands", ".claw/commands", ".codex/commands"] {
                let p = workdir.join(dir);
                if p.is_dir() { roots.push(p); }
            }
            // 用户级
            if let Ok(home) = std::env::var("IF2AI_HOME") {
                let p = std::path::PathBuf::from(&home).join("skills");
                if p.is_dir() { roots.push(p); }
            }
            if let Ok(home) = std::env::var("HOME") {
                let p = std::path::PathBuf::from(&home).join(".if2ai/skills");
                if p.is_dir() { roots.push(p); }
            }
            roots
        }

