    must_implement:
      - |
        // 08-critical-fix-priority.md §N3 — 标记废弃 (lib.rs)
        // 在 lib.rs 顶部添加：
        #![deprecated(
            since = "0.2.0",
            note = "This GlobalToolRegistry is a baseline copy. All tools are being migrated to ToolRegistry (modules/tools/registry.rs) \
                    using the ToolHandler pattern. See docs/bs_gap/08-critical-fix-priority.md §N3 for migration plan."
        )]

        // 在注释中说明迁移状态：
        // Migration Status (方案 A 全量迁移):
        //   ✅ Migrated: TodoWrite (→ builtin/todo_write.rs)
        //   ⏳ Pending: Skill, ToolSearch, Agent, grep_search, Sleep, SendUserMessage,
        //               Config, NotebookEdit, StructuredOutput, PowerShell
        //   🔄 Overlap (to be replaced): bash, read_file, write_file, edit_file,
        //                                glob_search, web_fetch, web_search

      - |
        // 08-critical-fix-priority.md §N3 — 迁移 TodoWrite（新建 builtin/todo_write.rs）
        // 路径验证：确认从 GlobalToolRegistry sync match → ToolRegistry async ToolHandler 的适配链路畅通
        use super::super::registry::{ToolEntry, ToolError};

        /// TodoWrite 工具的数据结构（从 lib.rs 提取）
        #[derive(serde::Deserialize)]
        struct TodoItem {
            content: String,
            #[serde(rename = "activeForm", default)]
            active_form: String,
            status: String,  // "pending" | "in_progress" | "completed"
        }

        #[derive(serde::Deserialize)]
        struct TodoWriteInput {
            todos: Vec<TodoItem>,
        }

        /// TodoWrite 工具的执行结果（从 lib.rs 提取）
        #[derive(serde::Serialize)]
        struct TodoWriteResult {
            old_todos: Option<Vec<TodoItem>>,
            new_todos: Vec<TodoItem>,
            verification_nudge_needed: Option<String>,
        }

        /// Todo 存储路径（从 CLAW_TODO_STORE 改为 IF2AI_TODO_STORE）
        fn todo_store_path() -> std::path::PathBuf {
            let env_var = std::env::var("IF2AI_TODO_STORE").unwrap_or_default();
            if env_var.is_empty() {
                std::env::current_dir()
                    .unwrap_or_else(|_| std::path::PathBuf::from("."))
                    .join(".if2ai-todos.json")
            } else {
                std::path::PathBuf::from(env_var)
            }
        }

        /// TodoWrite ToolHandler 入口（ToolEntry 构造）
        pub fn todo_write_tool_entry() -> ToolEntry {
            ToolEntry {
                name: "TodoWrite".to_string(),
                toolset: "utility".to_string(),
                description: "Update the structured task list for the current session. \
                              Use this to track multi-step tasks with status (pending/in_progress/completed)."
                    .to_string(),
                input_schema: serde_json::json!({
                    "type": "object",
                    "properties": {
                        "todos": {
                            "type": "array",
                            "items": {
                                "type": "object",
                                "properties": {
                                    "content": { "type": "string", "description": "Task description" },
                                    "activeForm": { "type": "string", "description": "Present-tense action description" },
                                    "status": { "type": "string", "enum": ["pending", "in_progress", "completed"] }
                                },
                                "required": ["content", "status"]
                            }
                        }
                    },
                    "required": ["todos"]
                }),
                max_result_size: Some(10240),
                timeout_secs: Some(30),
                disabled: false,
                handler: std::sync::Arc::new(|args, _ctx| {
                    Box::pin(async move {
                        let input: TodoWriteInput = serde_json::from_value(args.clone())
                            .map_err(|e| ToolError::Handler(format!("Invalid TodoWrite input: {}", e)))?;
                        let result = execute_todo_write_internal(&input.todos)
                            .map_err(ToolError::Handler)?;
                        serde_json::to_string_pretty(&result)
                            .map_err(|e| ToolError::Handler(e.to_string()))
                    })
                }),
            }
        }

        /// 核心执行逻辑（从 lib.rs execute_todo_write 提取并适配）
        fn execute_todo_write_internal(todos: &Vec<TodoItem>) -> Result<TodoWriteResult, String> {
            let store_path = todo_store_path();
            // 读取旧 todos
            let old_todos = if store_path.exists() {
                let content = std::fs::read_to_string(&store_path)
                    .map_err(|e| format!("Failed to read todo store: {}", e))?;
                serde_json::from_str(&content).ok()
            } else {
                None
            };

            // 写回新 todos
            let json = serde_json::to_string_pretty(todos)
                .map_err(|e| format!("Failed to serialize todos: {}", e))?;
            std::fs::write(&store_path, json)
                .map_err(|e| format!("Failed to write todo store: {}", e))?;

            Ok(TodoWriteResult {
                old_todos,
                new_todos: todos.clone(),
                verification_nudge_needed: None,
            })
        }

      - |
        // mod.rs — 注册 TodoWrite（在 register_builtin_tools 中）
        if let Err(e) = registry.register(builtin::todo_write::todo_write_tool_entry()) {
            eprintln!("Failed to register TodoWrite tool: {}", e);
        }

        // mod.rs — 确保不导入 lib.rs 的内容
        // 当前 mod.rs 未导入 lib.rs 内容（确认中），如果有则移除

    acceptance:
