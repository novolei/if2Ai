    must_implement:
      - |
        // 08-critical-fix-priority.md §F5 — SlashCommand Tauri commands (新建 slash.rs)
        use crate::modules::commands::lib::{SlashCommand, slash_command_specs, suggest_slash_commands, handle_slash_command};

        #[derive(serde::Serialize)]
        pub struct SlashCommandParseResult {
            pub name: String,
            pub matched: bool,
        }

        #[derive(serde::Serialize)]
        pub struct SlashCommandSpecDto {
            pub name: String,
            pub description: String,
            pub category: String,
        }

        #[tauri::command]
        pub fn parse_slash_command(input: String) -> SlashCommandParseResult {
            let matched = SlashCommand::parse(&input).is_some();
            let name = input.split_whitespace().next().unwrap_or("").to_string();
            SlashCommandParseResult { name, matched }
        }

        #[tauri::command]
        pub fn list_slash_commands() -> Vec<SlashCommandSpecDto> {
            slash_command_specs().iter().map(|s| SlashCommandSpecDto {
                name: s.name.to_string(),
                description: s.description.to_string(),
                category: format!("{:?}", s.category),
            }).collect()
        }

        #[tauri::command]
        pub fn suggest_slash_commands_endpoint(input: String, limit: usize) -> Vec<String> {
            suggest_slash_commands(&input, limit)
        }

      - |
        // 08-critical-fix-priority.md §F17 — /skills /agents Tauri commands (slash.rs 追加)
        use crate::modules::commands::lib::{discover_skill_roots, parse_skill_frontmatter};

        #[derive(serde::Serialize)]
        pub struct SkillInfo {
            pub name: String,
            pub description: String,
            pub path: String,
        }

        #[derive(serde::Serialize)]
        pub struct AgentInfo {
            pub name: String,
            pub description: String,
            pub path: String,
        }

        #[tauri::command]
        pub fn list_skills(cwd: String) -> Vec<SkillInfo> {
            let workdir = std::path::Path::new(&cwd);
            let roots = discover_skill_roots(workdir);
            let mut skills = Vec::new();
            for root in roots {
                if let Ok(entries) = std::fs::read_dir(&root) {
                    for entry in entries.flatten() {
                        let skill_md = entry.path().join("SKILL.md");
                        if skill_md.is_file() {
                            if let Ok(content) = std::fs::read_to_string(&skill_md) {
                                let meta = parse_skill_frontmatter(&content);
                                skills.push(SkillInfo {
                                    name: meta.name.unwrap_or_else(|| entry.file_name().to_string_lossy().into_owned()),
                                    description: meta.description.unwrap_or_default(),
                                    path: entry.path().to_string_lossy().into_owned(),
                                });
                            }
                        }
                    }
                }
            }
            skills
        }

        #[tauri::command]
        pub fn list_agents(cwd: String) -> Vec<AgentInfo> {
            // 类似 list_skills，搜索 .if2ai/agents/ 等目录
            let agents_dir = std::path::Path::new(&cwd).join(".if2ai/agents");
            let mut agents = Vec::new();
            if agents_dir.is_dir() {
                if let Ok(entries) = std::fs::read_dir(&agents_dir) {
                    for entry in entries.flatten() {
                        if entry.path().is_dir() {
                            agents.push(AgentInfo {
                                name: entry.file_name().to_string_lossy().into_owned(),
                                description: String::new(),
                                path: entry.path().to_string_lossy().into_owned(),
                            });
                        }
                    }
                }
            }
            agents
        }

      - |
