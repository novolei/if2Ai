# Phase 2: 高级特性 (Advanced Features)
# ─────────────────────────────────────────────────────────────────────────────
# 前置条件：Phase 1 全部 slice 状态为 done，且人工 review 通过。
# 本文件由 AI 根据 design-docs 生成，经人工 review 确认后可执行。
# phase_status: draft → 由人类改为 active 方可让 executor 执行
# ─────────────────────────────────────────────────────────────────────────────

meta:
  phase: 2
  phase_status: draft          # draft | active | completed
  title: "高级特性 (Advanced Features)"
  owner: "@architects"
  depends_on_phase: 1
  design_docs:
    - docs/design-docs/prompt-builder.md
    - docs/design-docs/context-compression.md
    - docs/design-docs/error-handling.md
    - docs/design-docs/llm-routing.md          # 新增：fallback/routing 集成
    - docs/design-docs/memory-system.md
    - docs/design-docs/messaging-gateway.md
    - docs/design-docs/testing-strategy.md
  human_checkpoints:
    - after_slice: "2.1"       # PromptBuilder 完成后 review（Stage 1 checkpoint）
    - after_slice: "2.2"       # Context Compression 完成后 review（Stage 2 checkpoint）
    - after_slice: "2.3"       # ErrorHandling + ProviderFallback 完成后 review（Stage 3 checkpoint）
    - after_slice: "2.4"       # LLM Routing 完成后 review（Stage 4a checkpoint）
    - after_slice: "2.5"       # MessagingGateway (Telegram) 完成后 review（Stage 4b checkpoint）
    - after_slice: "2.5b"      # MessagingGateway (Discord) 完成后 review（Stage 4c checkpoint）
    - after_slice: "2.6"       # 全部 Phase 2 完成后 final review（含集成测试）

slices:

  # ───────────── Stage 1: 核心提示词和上下文管理 ────────────────────────────

  - id: "2.1"
    title: "PromptBuilder — 动态系统提示词构建"
    status: pending
    design_ref: "docs/design-docs/prompt-builder.md"
    backlog_ref: "BL-201"
    impl_targets:
      - src-tauri/src/modules/runtime/prompt.rs   # MODIFY: 在现有 SystemPromptBuilder 基础上扩展

    current_state: |
      文件 prompt.rs EXISTS。已有：
        SystemPromptBuilder（builder 模式，build() 返回 Vec<String>，render() 返回 String），
        PromptBuildError enum，ProjectContext，ContextFile，load_system_prompt()。
      ❌ MISSING — 以下类型在文件中不存在，必须新增：
        1. PromptBuilder struct（design doc §系统架构）——与 SystemPromptBuilder 不同，
           含 AgentDefinition、tool_definitions、PromptConfig 字段
        2. PromptConfig struct（含 include_examples、tool_format: ToolFormatStyle、language 字段）
        3. ToolFormatStyle enum（OpenAI / Claude / Custom 三个变体）
        4. AgentDefinition struct（name/role/capabilities/tone/language_preferences 字段）
        5. LanguagePrefs struct
        6. PromptBuilder::build() 方法（返回 String，整合 AgentDefinition + tools + context）
      注意：SystemPromptBuilder 保留，但 PromptBuilder 是 design_ref 要求的新类型。

    must_implement:
      - |
        // prompt-builder.md §系统架构 — PromptBuilder（新增，不替换 SystemPromptBuilder）
        pub struct PromptBuilder {
            agent_definition: AgentDefinition,
            tool_definitions: Vec<ToolDefinition>,
            config: PromptConfig,
        }
        impl PromptBuilder {
            pub fn new(agent: AgentDefinition, config: PromptConfig) -> Self
            pub fn with_tools(mut self, tools: Vec<ToolDefinition>) -> Self
            pub fn build(&self) -> Result<String, PromptBuildError>
        }
      - |
        // prompt-builder.md §ToolFormatStyle
        pub enum ToolFormatStyle { OpenAI, Claude, Custom(String) }
      - |
        // prompt-builder.md §AgentDefinition
        pub struct AgentDefinition {
            pub name: String,
            pub role: String,
            pub capabilities: Vec<String>,
            pub tone: String,
            pub language_preferences: LanguagePrefs,
        }
        pub struct LanguagePrefs { pub primary_language: String }
      - |
        // prompt-builder.md §PromptConfig
        pub struct PromptConfig {
            pub tool_format: ToolFormatStyle,
            pub language: String,
            pub max_context_tokens: Option<u32>,
            pub include_examples: bool,
        }

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/modules/runtime/prompt.rs"
        grep: "pub struct PromptBuilder"
        label: "PromptBuilder struct — prompt-builder.md §系统架构"
      - type: symbol
        file: "src-tauri/src/modules/runtime/prompt.rs"
        grep: "ToolFormatStyle"
        label: "ToolFormatStyle enum — prompt-builder.md"
      - type: symbol
        file: "src-tauri/src/modules/runtime/prompt.rs"
        grep: "pub struct AgentDefinition"
        label: "AgentDefinition struct — prompt-builder.md"
      - type: test
        cmd: "cargo test -p if2ai-backend -- runtime::prompt"
        expect: "all tests pass"
    review_checklist:
      - "PromptBuilder struct 是否新增（不是对 SystemPromptBuilder 重命名）"
      - "AgentDefinition / PromptConfig / ToolFormatStyle 三个类型是否实现"
      - "PromptBuilder::build() 是否按 prompt-builder.md §提示词构建流程 的槽位顺序构建"
      - "ToolFormatStyle::OpenAI 和 Claude 是否输出格式不同的 tool 定义"
      - "language 字段控制回复语言（zh/en），build() 中有对应逻辑"
      - "无 unwrap()（测试除外）"

  - id: "2.2"
    title: "ContextCompression — 长对话自适应压缩"
    status: pending
    design_ref: "docs/design-docs/context-compression.md"
    backlog_ref: "BL-202"
    impl_targets:
      - src-tauri/src/modules/runtime/compression.rs   # 必须新建此文件

    current_state: |
      compact.rs EXISTS，已有：
        CompactionConfig、CompactionResult、should_compact()（自由函数）、compact_session()。
      ❌ MISSING — compression.rs 不存在，必须新建包含 design_ref 要求的类型：
        1. ContextWindowManager struct（design doc §核心组件 1）——有 should_compress()、
           available_tokens()、utilization_ratio()、compression_needed_tokens() 方法
        2. estimate_tokens(text: &str) -> u32 函数
        3. CompressionPipeline struct（§核心组件 2）——有 async compress() 方法
        4. MessagePruner struct、ProtectionRange struct、ContextSummarizer struct
        5. CompressionStats struct（记录压缩前后 token 数、压缩比等）
      注意：compact.rs 中的 should_compact() 是自由函数，而 design_ref 要求是
            ContextWindowManager 的方法。harness suite context_compression.yaml 中
            测试函数路径是 runtime::compression::tests::...，因此必须新建 compression.rs。

    must_implement:
      - |
        // context-compression.md §核心组件 1 — 必须新建 compression.rs
        pub struct ContextWindowManager {
            pub window_size: u32,
            pub compression_threshold: f32,    // default 0.5
            pub reserved_for_response: u32,
            pub protected_head_size: u32,
            pub protected_tail_size: u32,
        }
        impl ContextWindowManager {
            pub fn available_tokens(&self) -> u32
            pub fn utilization_ratio(&self, current_tokens: u32) -> f32
            pub fn should_compress(&self, current_tokens: u32) -> bool
            pub fn compression_needed_tokens(&self, current_tokens: u32) -> u32
        }
        pub fn estimate_tokens(text: &str) -> u32
      - |
        // context-compression.md §核心组件 2
        pub struct CompressionPipeline {
            window_manager: ContextWindowManager,
        }
        impl CompressionPipeline {
            pub fn new(window_manager: ContextWindowManager) -> Self
            pub async fn compress(
                &self,
                messages: &mut Vec<ConversationMessage>,
                api_client: &dyn ApiClient,
            ) -> Result<CompressionStats, RuntimeError>
        }
      - |
        // 压缩统计
        pub struct CompressionStats {
            pub messages_before: usize,
            pub messages_after: usize,
            pub tokens_before: u32,
            pub tokens_after: u32,
        }

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/modules/runtime/compression.rs"
        grep: "pub struct ContextWindowManager"
        label: "ContextWindowManager — context-compression.md §核心组件 1"
      - type: symbol
        file: "src-tauri/src/modules/runtime/compression.rs"
        grep: "pub struct CompressionPipeline"
        label: "CompressionPipeline — context-compression.md §核心组件 2"
      - type: symbol
        file: "src-tauri/src/modules/runtime/compression.rs"
        grep: "pub fn estimate_tokens"
        label: "estimate_tokens() — context-compression.md"
      - type: test
        cmd: "cargo test -p if2ai-backend -- runtime::compression"
        expect: "all tests pass"
      - type: harness
        suite: "harness/suites/context_compression.yaml"
    review_checklist:
      - "compressionrs 是否新建（不是修改 compact.rs）"
      - "ContextWindowManager::should_compress() 在 utilization > threshold 时返回 true"
      - "CompressionPipeline::compress() 是否按顺序 Prune → Protect Head/Tail → Summarize Middle"
      - "压缩后历史长度是否严格 < 压缩前"
      - "CompressionStats 是否记录 before/after messages 和 token 数"
      - "protected_head/tail 大小可通过 ContextWindowManager 字段配置"
      - "无 unwrap()（测试除外）"

  - id: "2.3"
    title: "AgentError 统一错误分类、指数退避重试与 Provider Fallback"
    status: pending
    design_ref: "docs/design-docs/error-handling.md"
    backlog_ref: "BL-203"
    impl_targets:
      - src-tauri/src/modules/runtime/error.rs    # 必须新建
      - src-tauri/src/modules/api/fallback.rs     # 必须新建

    current_state: |
      error.rs 在 src-tauri/src/modules/runtime/ 下不存在（无此文件）。
      fallback.rs 在 src-tauri/src/modules/api/ 下不存在。
      已有 RuntimeError（在 conversation.rs 中，简单 struct），不符合 design_ref 的 enum 结构。
      ❌ MISSING — 两个文件均从零新建：
        1. error.rs：AgentError enum（含 LLMError/ToolError/ContextError/SystemError 四大类），
           LLMErrorType enum，ToolErrorType enum，ContextErrorType enum，SystemErrorType enum
        2. error.rs：RetryPolicy struct + with_exponential_backoff() + is_retriable() 方法
        3. error.rs：ErrorHandler struct + handle()（按错误类型分发到不同策略）
        4. fallback.rs：FallbackChain struct（有序备用 provider 列表），
           FallbackChain::next_provider()，FallbackChain::try_with_fallback() 异步方法

    must_implement:
      - |
        // error-handling.md §错误类型定义 — 新建 error.rs
        #[derive(Debug, Clone)]
        pub enum AgentError {
            LLMError { provider: String, model: String, error_type: LLMErrorType, message: String, retriable: bool },
            ToolError { tool_name: String, error_type: ToolErrorType, message: String, retriable: bool },
            ContextError { error_type: ContextErrorType, message: String },
            SystemError { error_type: SystemErrorType, message: String },
        }
        impl AgentError {
            pub fn is_retriable(&self) -> bool
            pub fn is_transferable(&self) -> bool   // 需要 provider fallback
            pub fn is_fatal(&self) -> bool
        }
      - |
        // error-handling.md §恢复策略
        pub struct RetryPolicy { pub max_retries: u32, pub initial_delay_ms: u64, pub backoff_factor: f32 }
        impl RetryPolicy {
            pub fn default_exponential() -> Self  // 最多 3 次，初始 1s，factor 2.0
            pub async fn execute<F, T, E>(&self, operation: F) -> Result<T, AgentError>
            where F: Fn() -> impl Future<Output = Result<T, E>>
        }
      - |
        // error-handling.md §故障转移 — 新建 fallback.rs
        pub struct FallbackChain { providers: Vec<String> }
        impl FallbackChain {
            pub fn new(providers: Vec<String>) -> Self
            pub fn next_provider(&self, current: &str) -> Option<&str>
            pub async fn try_with_fallback<F, T>(
                &self,
                current_provider: &str,
                operation: F,
            ) -> Result<T, AgentError>
            where F: Fn(&str) -> impl Future<Output = Result<T, AgentError>>
        }

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/modules/runtime/error.rs"
        grep: "pub enum AgentError"
        label: "AgentError enum — error-handling.md §错误类型定义"
      - type: symbol
        file: "src-tauri/src/modules/runtime/error.rs"
        grep: "is_retriable"
        label: "is_retriable() — error-handling.md §分类判断"
      - type: symbol
        file: "src-tauri/src/modules/api/fallback.rs"
        grep: "pub struct FallbackChain"
        label: "FallbackChain — error-handling.md §故障转移"
      - type: test
        cmd: "cargo test -p if2ai-backend -- runtime::error api::fallback"
        expect: "all tests pass"
    review_checklist:
      - "AgentError 是否包含 LLMError/ToolError/ContextError/SystemError 四个变体"
      - "is_retriable() 是否正确区分可恢复错误（RateLimit/Timeout）vs 致命错误"
      - "is_transferable() 是否正确标记需要 provider 切换的错误（InvalidAPIKey/ProviderDown）"
      - "RetryPolicy::execute() 是否实现指数退避（最多 3 次，初始延迟可配置）"
      - "FallbackChain::try_with_fallback() 是否在当前 provider 失败后自动尝试下一个"
      - "所有错误类型实现 std::error::Error trait"
      - "重试逻辑有单元测试：模拟 3 次失败后成功的场景"
      - "无 unwrap()（测试除外）"

  # ───────────── Stage 2: 记忆系统 ──────────────────────────────────────────

  - id: "2.4"
    title: "MemorySystem — 内置记忆（MEMORY.md + USER.md）+ MemoryManager"
    status: pending
    design_ref: "docs/design-docs/memory-system.md"
    backlog_ref: "BL-204"
    impl_targets:
      - src-tauri/src/modules/memory/mod.rs     # 必须新建整个 memory 模块
      - src-tauri/src/modules/memory/provider.rs # MemoryProvider trait
      - src-tauri/src/modules/memory/builtin.rs  # BuiltInMemory 实现
      - src-tauri/src/modules/memory/manager.rs  # MemoryManager

    current_state: |
      src-tauri/src/modules/ 下不存在 memory/ 目录（整个模块从零新建）。
      ❌ MISSING — 全部从零新建：
        1. provider.rs: MemoryProvider trait（store/recall/inject_context 方法）
        2. builtin.rs: BuiltInMemory 读写 ~/.if2ai/MEMORY.md 和 USER.md
        3. manager.rs: MemoryManager 持有 Vec<Box<dyn MemoryProvider>>，协调多个 provider
        4. mod.rs: pub use 导出
        5. src-tauri/src/modules/mod.rs 里也必须 pub mod memory; 对外导出
      Honcho 集成暂时跳过，作为 feature flag: honcho 预留接口。

    must_implement:
      - |
        // memory-system.md §外部记忆提供商 — provider.rs
        pub trait MemoryProvider: Send + Sync {
            async fn initialize(&mut self) -> Result<(), MemoryError>;
            async fn store_memory(&self, memory: MemoryEntry) -> Result<String, MemoryError>;
            async fn recall_memories(&self, query: &str, limit: usize) -> Result<Vec<MemoryEntry>, MemoryError>;
            fn inject_context(&self) -> String;  // 将记忆注入 system prompt 的文本
            fn provider_name(&self) -> &str;
        }
        pub struct MemoryEntry { pub content: String, pub tags: Vec<String>, pub created_at: String }
        #[derive(Debug)] pub enum MemoryError { Io(String), ParseError(String), NotAvailable(String) }
      - |
        // memory-system.md §内置记忆 — builtin.rs
        pub struct BuiltInMemory { memory_file: PathBuf, user_file: PathBuf }
        impl BuiltInMemory {
            pub fn new(base_dir: PathBuf) -> Self
            pub fn load(&mut self) -> Result<(), MemoryError>    // 读 MEMORY.md + USER.md
        }
        impl MemoryProvider for BuiltInMemory { ... }
      - |
        // memory-system.md §MemoryManager — manager.rs
        pub struct MemoryManager { providers: Vec<Box<dyn MemoryProvider>> }
        impl MemoryManager {
            pub fn new() -> Self
            pub fn register(&mut self, provider: Box<dyn MemoryProvider>)
            pub async fn inject_all_contexts(&self) -> String  // 合并所有 provider 的 inject_context()
            pub async fn store_to_all(&self, memory: MemoryEntry) -> Vec<Result<String, MemoryError>>
        }

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/modules/memory/provider.rs"
        grep: "pub trait MemoryProvider"
        label: "MemoryProvider trait — memory-system.md"
      - type: symbol
        file: "src-tauri/src/modules/memory/builtin.rs"
        grep: "pub struct BuiltInMemory"
        label: "BuiltInMemory — memory-system.md §内置记忆"
      - type: symbol
        file: "src-tauri/src/modules/memory/manager.rs"
        grep: "pub struct MemoryManager"
        label: "MemoryManager — memory-system.md"
      - type: test
        cmd: "cargo test -p if2ai-backend -- memory"
        expect: "all tests pass"
    review_checklist:
      - "memory/ 目录是否从零新建，包含 mod.rs/provider.rs/builtin.rs/manager.rs"
      - "modules/mod.rs 是否有 pub mod memory;"
      - "BuiltInMemory::load() 是否在文件不存在时创建空文件（不 panic）"
      - "inject_context() 返回可嵌入 system prompt 的文本格式"
      - "MemoryManager::register() 是否支持注册多个 provider"
      - "记忆读写失败映射到 MemoryError，不崩溃"
      - "Honcho 集成接口（HonchoProvider 骨架）通过 feature flag: honcho 预留"
      - "无 unwrap()（测试除外）"

  # ───────────── Stage 3: 消息网关 ──────────────────────────────────────────

  - id: "2.5"
    title: "MessagingGateway — Base Trait + Telegram 适配器"
    status: pending
    design_ref: "docs/design-docs/messaging-gateway.md"
    backlog_ref: "BL-205 (part 1/2)"
    impl_targets:
      - src-tauri/src/modules/plugins/gateway/adapter.rs   # 必须新建
      - src-tauri/src/modules/plugins/gateway/handler.rs   # 必须新建
      - src-tauri/src/modules/plugins/gateway/telegram.rs  # 必须新建
      - src-tauri/src/modules/plugins/gateway/mod.rs       # MODIFY：re-export
      - src-tauri/Cargo.toml                             # MODIFY：添加 teloxide (features: ["gateway-telegram"])

    current_state: |
      src-tauri/src/modules/plugins/ 目录 EXISTS（hooks.rs, lib.rs, mod.rs），但无 gateway/ 子目录。
      ❌ MISSING — 以下文件/目录完全不存在，必须新建：
        1. plugins/gateway/ 目录（新建）
        2. adapter.rs：MessagingAdapter trait（start/send_message/send_typing/platform_name）
        3. handler.rs：IncomingMessage struct、OutgoingMessage struct、MessageHandler trait，
           GatewaySession struct（per-chat 会话状态绑定）
        4. telegram.rs：TelegramAdapter 实现 MessagingAdapter，long-polling，
           TELEGRAM_BOT_TOKEN 环境变量，每个 chat_id 独立 Session
        5. MockAdapter：实现完整 MessagingAdapter trait，用于单元测试（无需真实 token）
      注意：teloxide crate 需要加入 Cargo.toml（feature: gateway-telegram）。

    must_implement:
      - |
        // messaging-gateway.md §API 设计 — adapter.rs
        pub trait MessagingAdapter: Send + Sync {
            async fn start(&mut self) -> Result<(), GatewayError>;
            async fn send_message(&self, chat_id: &str, msg: OutgoingMessage) -> Result<(), GatewayError>;
            async fn send_typing(&self, chat_id: &str) -> Result<(), GatewayError>;
            fn platform_name(&self) -> &str;
        }
        #[derive(Debug)] pub enum GatewayError { AuthFailed(String), SendFailed(String), Disconnected }
      - |
        // messaging-gateway.md §消息流处理 — handler.rs
        pub struct IncomingMessage {
            pub platform: String, pub chat_id: String, pub user_id: String,
            pub text: String, pub timestamp: String,
        }
        pub struct OutgoingMessage { pub text: String, pub reply_to: Option<String> }
        pub trait MessageHandler: Send + Sync {
            async fn handle(&self, msg: IncomingMessage) -> Result<OutgoingMessage, GatewayError>;
        }
        pub struct GatewaySession { pub chat_id: String, pub agent_session_id: String, pub platform: String }
      - |
        // messaging-gateway.md §Telegram — telegram.rs
        pub struct TelegramAdapter { bot_token: String, message_handler: Arc<dyn MessageHandler> }
        impl TelegramAdapter {
            pub fn from_env(handler: Arc<dyn MessageHandler>) -> Result<Self, GatewayError>
        }
        impl MessagingAdapter for TelegramAdapter { ... }
      - |
        // 测试用 — adapter.rs 或 telegram.rs
        pub struct MockAdapter { sent_messages: Arc<Mutex<Vec<OutgoingMessage>>> }
        impl MessagingAdapter for MockAdapter { ... }

    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai-backend"
      - type: symbol
        file: "src-tauri/src/modules/plugins/gateway/adapter.rs"
        grep: "pub trait MessagingAdapter"
        label: "MessagingAdapter trait — messaging-gateway.md"
      - type: symbol
        file: "src-tauri/src/modules/plugins/gateway/handler.rs"
        grep: "pub struct IncomingMessage"
        label: "IncomingMessage — messaging-gateway.md §消息流处理"
      - type: symbol
        file: "src-tauri/src/modules/plugins/gateway/telegram.rs"
        grep: "pub struct TelegramAdapter"
        label: "TelegramAdapter — messaging-gateway.md §Telegram"
      - type: test
        cmd: "cargo test -p if2ai-backend -- plugins::gateway"
        expect: "all tests pass"
    review_checklist:
      - "MessagingAdapter trait 是否有 start/send_message/send_typing/platform_name 四个方法"
      - "TelegramAdapter::from_env() 是否从 TELEGRAM_BOT_TOKEN 读取，不硬编码"
      - "每个 chat_id 是否对应独立 GatewaySession（通过 SessionManager 创建）"
      - "消息处理是否在独立 tokio::spawn 中，不阻塞 polling 主循环"
      - "MockAdapter 是否实现完整 MessagingAdapter，支持记录发送的消息用于断言"
      - "teloxide crate 是否通过 feature flag: gateway-telegram 控制编译"
      - "无 unwrap()（测试除外）"

