# Phase M4: Policy Harness Governance
# ─────────────────────────────────────────────────────────────────────────────
# 让 boundary / permission / sandbox 与 Harness V2 真正联动，把系统带入
# “策略可治理、可评测、可阻断”的阶段。
# ─────────────────────────────────────────────────────────────────────────────

meta:
  phase: "m4"
  phase_status: backend_complete_frontend_deferred
  phase_status_note: |
    M4 后端治理链（m4.1 ~ m4.5、m4.7、m4.8）已落地并 cargo check 通过，
    并通过 Tauri command 暴露到 IPC 层（见 src-tauri/src/commands/harness.rs）。
    m4.6（前端 governance dashboard 投影面）明确延后，不阻塞 M5 入场——
    详见 §m4.6 slice 的 status / deferral_reason。
    本 phase 不再视为 “未开始 / proposed”，也不视为 “m4.6 未完则全部未完”。
    M5 入场前置条件改为：m4.1 ~ m4.5、m4.7、m4.8 状态为 done。
  title: "Policy Harness Governance"
  owner: "@executor"
  depends_on_phase: "m3"
  execution_runbook: "docs/exec-plans/active/phase-m4-executor-runbook.md"
  executor_quickstart:
    - "先读 docs/exec-plans/active/phase-m-remediation-execution-index.md，再读本 YAML。"
    - "M4 当前已是 backend_complete_frontend_deferred；不要回头重做 m4.1 ~ m4.5 / m4.7 / m4.8 已完成的契约。"
    - "如需重新打开 m4.6 governance UI，必须开新的 follow-on phase 或显式恢复本 slice 状态，不要在 M5 slice 里顺手做。"
    - "优先进入对应的 phase-m4-*.md file-level plan 仅在需要修补的范围内查阅。"
  design_docs:
    - docs/staff-remediation/if2ai-staff-remediation-blueprint.md
    - docs/staff-remediation/backend-application-control-plane-refactor-design.md
    - docs/staff-remediation/if2ai-worker-adoption-design.md
    - docs/staff-remediation/harness-v2-governance-design.md
    - docs/staff-remediation/runtime-contracts-and-event-projection-design.md
    - docs/staff-remediation/request-intelligence-and-execution-mode-routing-design.md
    - docs/exec-plans/active/phase-m4-executor-runbook.md
