# Phase 6E: Agent Loop Harness Framework
# ─────────────────────────────────────────────────────────────────────────────
# 运行时观测与控制框架 — 让生产 APP 的 Agent 行为可测、可控、可优化、可复现
# ─────────────────────────────────────────────────────────────────────────────

meta:
  phase: "6e"
  phase_status: draft
  title: "Agent Loop Harness Framework — 运行时观测与控制框架"
  owner: "@executor"
  depends_on_phase: "6a"
  design_docs:
    - docs/design-docs/postCLI/ADR/ADR-011-Agent-Loop-Harness-Framework.md
  human_checkpoints:
    - after_slice: "6e.3"

slices:

  - id: "6e.1"
    title: "EventBus Core — 事件总线核心"
    status: pending
    design_ref: "docs/design-docs/postCLI/ADR/ADR-011-Agent-Loop-Harness-Framework.md"
    impl_targets:
      - src-tauri/src/modules/harness/mod.rs
      - src-tauri/src/modules/harness/event_bus.rs
      - src-tauri/src/modules/harness/types.rs
    must_implement:
      - "EventBus 单例 (global()) 方法，thread-safe"
      - "AgentEvent 枚举定义 (TurnStart, TurnEnd, LlmStart, LlmEnd, ToolStart, ToolEnd, DecisionPoint, Error)"
      - "EventSubscriber trait 和 subscribe()/emit() 方法"
      - "mpsc::unbounded_channel 非阻塞发送"
    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai"
      - type: test
        cmd: "cargo test -p if2ai harness::event_bus"
    review_checklist:
      - "EventBus 单例是 thread-safe"
      - "emit 不阻塞主循环"
      - "所有 AgentEvent 枚举成员已定义"

  - id: "6e.2"
    title: "TelemetryCollector — 遥测收集器"
    status: pending
    design_ref: "docs/design-docs/postCLI/ADR/ADR-011-Agent-Loop-Harness-Framework.md"
    depends_on: ["6e.1"]
    impl_targets:
      - src-tauri/src/modules/harness/telemetry.rs
    must_implement:
      - "TokenStats 结构体 (input_tokens, output_tokens, cache_read, cache_creation, estimated_cost)"
      - "ToolStats 结构体 (call_count, total_duration_ms, success_count, failure_count)"
      - "TelemetryCollector::new(event_bus: &EventBus)"
      - "get_token_stats() 和 get_tool_stats() 方法"
      - "订阅 LlmStart/LlmEnd, ToolStart/ToolEnd 事件"
    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai"
      - type: test
        cmd: "cargo test -p if2ai harness::telemetry"
    review_checklist:
      - "Token 统计计算正确"
      - "工具耗时统计正确"
      - "并发访问安全 (RwLock)"

  - id: "6e.3"
    title: "AgentLoopIntegration — 集成到 start_agent_stream"
    status: pending
    design_ref: "docs/design-docs/postCLI/ADR/ADR-011-Agent-Loop-Harness-Framework.md"
    depends_on: ["6e.1"]
    impl_targets:
      - src-tauri/src/commands/agent.rs
    must_implement:
      - "Turn 开始时 emit AgentEvent::TurnStart"
      - "LLM 调用前 emit AgentEvent::LlmStart"
      - "LLM 调用后 emit AgentEvent::LlmEnd"
      - "工具执行前 emit AgentEvent::ToolStart"
      - "工具执行后 emit AgentEvent::ToolEnd"
      - "决策点 emit AgentEvent::DecisionPoint"
      - "错误时 emit AgentEvent::Error"
      - "Turn 结束时 emit AgentEvent::TurnEnd"
    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai"
      - type: count
        cmd: "grep -c 'event_bus.emit' src-tauri/src/commands/agent.rs"
        expect_gt: 0
    review_checklist:
      - "所有关键路径都有事件发射"
      - "event_bus 通过参数传入，不创建全局依赖"
      - "不破坏现有 SSE 事件流"

  - id: "6e.4"
    title: "SessionRecorder — 会话录制器"
    status: pending
    design_ref: "docs/design-docs/postCLI/ADR/ADR-011-Agent-Loop-Harness-Framework.md"
    depends_on: ["6e.1"]
    impl_targets:
      - src-tauri/src/modules/harness/recorder.rs
    must_implement:
      - "RecordingId, RecordedSession, RecordingMeta 结构体"
      - "SQLite 表 schema (harness_recordings, harness_events)"
      - "start_recording(session_id) -> RecordingId"
      - "stop_recording(recording_id)"
      - "get_recording(recording_id) -> RecordedSession"
      - "list_recordings(session_id) -> Vec<RecordingMeta>"
    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai"
      - type: test
        cmd: "cargo test -p if2ai harness::recorder"
    review_checklist:
      - "SQLite 表设计合理"
      - "录制可随时开始/停止"
      - "重放数据结构完整"

  - id: "6e.5"
    title: "HarnessControl — Tauri IPC 控制接口"
    status: pending
    design_ref: "docs/design-docs/postCLI/ADR/ADR-011-Agent-Loop-Harness-Framework.md"
    depends_on: ["6e.2", "6e.4"]
    impl_targets:
      - src-tauri/src/commands/harness.rs
    must_implement:
      - "harness_get_telemetry(session_id) -> TelemetrySnapshot"
      - "harness_start_recording(session_id) -> Result<RecordingId>"
      - "harness_stop_recording(recording_id) -> Result<RecordedSession>"
      - "harness_get_decision_history(session_id) -> Vec<DecisionRecord>"
      - "#[cfg(debug_assertions)] harness_inject_pause_point()"
    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai"
      - type: count
        cmd: "grep -c 'harness_' src-tauri/src/commands/harness.rs"
        expect_gt: 0
    review_checklist:
      - "IPC 命令正确暴露"
      - "返回值可被 Rust/JSON 解析"
      - "debug pause point 仅 debug build 有效"

  - id: "6e.6"
    title: "harness-cli — External CLI Binary"
    status: pending
    design_ref: "docs/design-docs/postCLI/ADR/ADR-011-Agent-Loop-Harness-Framework.md"
    depends_on: ["6e.5"]
    impl_targets:
      - harness-cli/src/main.rs
    must_implement:
      - "harness-cli CLI 使用 clap 实现"
      - "get-telemetry <session_id> 命令"
      - "start-recording <session_id> 命令"
      - "stop-recording <recording_id> 命令"
      - "replay <recording_id> 命令"
      - "dashboard (TUI) 命令"
    acceptance:
      - type: compile
        cmd: "cargo build -p harness-cli"
    review_checklist:
      - "CLI 参数解析正确"
      - "输出格式化正确"
      - "与 Tauri IPC 集成正确"

  - id: "6e.7"
    title: "Integration Tests — 集成测试"
    status: pending
    design_ref: "docs/design-docs/postCLI/ADR/ADR-011-Agent-Loop-Harness-Framework.md"
    depends_on: ["6e.1", "6e.2", "6e.3", "6e.4", "6e.5", "6e.6"]
    impl_targets:
      - src-tauri/test/harness_integration_test.rs
    must_implement:
      - "test_event_bus_no_drop — 验证事件不丢失"
      - "test_telemetry_stats_correct — 验证统计正确"
      - "test_recorder_records_full_session — 验证录制完整"
      - "test_control_ipc_commands — 验证 IPC 命令"
    acceptance:
      - type: compile
        cmd: "cargo check -p if2ai"
      - type: test
        cmd: "cargo test -p if2ai harness_integration"
    review_checklist:
      - "测试覆盖关键路径"
      - "mock 数据可验证"
      - "集成测试不依赖外部服务"

dashboard:
  last_updated: "2026-04-14"
  completed_slices: []
  current_slice: "6e.1"
  blocked: []
  notes: "Phase 6E draft — 等待批准后执行"

