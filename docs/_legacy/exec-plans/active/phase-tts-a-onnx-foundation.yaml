    current_state: |
      src-tauri/Cargo.toml 已有 ort 2.0.0-rc.10 / ndarray / tokenizers / hound / rand。
      缺：sentencepiece, symphonia, rubato。
      ort 2.x 的 KV cache (present_key_* → past_key_*) 张量来回喂路径未经验证。

    must_implement:
      - "Cargo.toml: 移除 tokenizers，新增 sentencepiece = \"0.11\""
      - "Cargo.toml: 新增 symphonia = { version = \"0.5\", features = [\"all-codecs\"] }"
      - "Cargo.toml: 新增 rubato = \"0.16\""
      - "src-tauri/tests/tts_ort_kv_spike.rs — 50 行集成测试，验证 ort Tensor::from_array
         能构造 [1, kv_heads, seq, head_dim] f32 张量并通过 ort::inputs! 喂入 session"

    impl_targets:
      - src-tauri/Cargo.toml
      - src-tauri/tests/tts_ort_kv_spike.rs

    acceptance:
      - "cargo build --workspace 通过"
      - "cargo test -p if2ai-backend tts_ort_kv_spike 通过"
      - "无 base64/ndarray/serde 版本冲突"

    review_checklist:
      - "sentencepiece crate 选 0.11+（FFI 到官方 C++）"
      - "symphonia 开 all-codecs 以支持 mp3/wav/flac"
      - "rubato 选 0.16 (高质量 SincFixedIn)"

  # ─────────────────────────────────────────────────────────────
  # Slice TTS-A.2: Manifest / TTS-meta / Codec-meta JSON 解析
  # ─────────────────────────────────────────────────────────────
  - id: "TTS-A.2"
    name: Manifest 三件套 JSON 解析（解决 Gap #3）
    status: pending
    priority: P0
    design_ref: docs/design-docs/postCLI/TTS/tts_gap_analysis_report.md §3.1
    estimated_days: 1.0

    current_state: |
      OnnxTtsProvider::from_dirs hardcode N_VQ=4, AUDIO_ASSISTANT_SLOT=1024,
      AUDIO_END=1025, AUDIO_PAD=0；ONNX 文件名也是 hardcode "prefill.onnx"。
      Python `OrtCpuRuntime` 全部从三个 JSON 读取：
        - browser_poc_manifest.json: generation_defaults, builtin_voices,
          tts_config, prompt_templates, model_files
        - tts_browser_onnx_meta.json: files.{prefill,decode_step,local_*}, model_config
        - codec_browser_onnx_meta.json: files.{encode,decode_full,decode_step},
          codec_config.{sample_rate,channels,num_quantizers}, streaming_decode

    must_implement:
      - "src-tauri/src/modules/tts/manifest/mod.rs — 模块入口 + ManifestBundle 聚合类型"
      - "src-tauri/src/modules/tts/manifest/browser_poc.rs — BrowserPocManifest serde
         结构 + load_from_dir(&Path)，支持 candidate paths fallback 与
         MOSS-TTS-Nano-ONNX-CPU/MOSS-TTS-Nano-100M-ONNX 别名映射"
      - "src-tauri/src/modules/tts/manifest/tts_meta.rs — TtsMeta serde 结构（files,
         model_config: hidden, kv_heads, head_dim, local_layers, local_heads,
         local_head_dim, audio_codebook_sizes, onnx output names）"
      - "src-tauri/src/modules/tts/manifest/codec_meta.rs — CodecMeta serde 结构
         （files, codec_config, streaming_decode: transformer_offsets +
         attention_caches 元信息）"
      - "ManifestBundle::resolve_onnx_path(key) → PathBuf：根据 meta files 拼出绝对路径"
      - "modules/tts/mod.rs: pub mod manifest"

    impl_targets:
      - src-tauri/src/modules/tts/manifest/mod.rs
      - src-tauri/src/modules/tts/manifest/browser_poc.rs
      - src-tauri/src/modules/tts/manifest/tts_meta.rs
      - src-tauri/src/modules/tts/manifest/codec_meta.rs
      - src-tauri/src/modules/tts/mod.rs

    acceptance:
      - "cargo test -p if2ai-backend modules::tts::manifest 全部通过"
      - "ManifestBundle::load(&model_dir) 在缺文件时返回结构化错误（含 tried paths）"
      - "ManifestBundle.tts_config.n_vq / audio_*_token_id 字段解析正确"
      - "ManifestBundle.builtin_voices 含 prompt_audio_codes: Vec<Vec<i32>>"

    review_checklist:
      - "所有 serde 结构 #[serde(rename_all = \"snake_case\")] 与 Python JSON 键一致"
      - "candidate paths fallback 完全 1:1 复刻 _resolve_manifest_path"
      - "MODEL_DIR_ALIAS_MAP 同 Python 实现"
      - "无 unwrap()"

  # ─────────────────────────────────────────────────────────────
  # Slice TTS-A.3: SentencePiece tokenizer 修复（解决 Gap #2）
  # ─────────────────────────────────────────────────────────────
  - id: "TTS-A.3"
    name: SentencePiece tokenizer 修复
    status: pending
    priority: P0
    design_ref: docs/design-docs/postCLI/TTS/tts_gap_analysis_report.md §2.3 R1
    estimated_days: 0.5

    current_state: |
      text/tokenizer.rs 用 tokenizers::Tokenizer::from_file(model_path) 加载
      .model 文件，HF tokenizers crate 不原生支持 SentencePiece protobuf 格式，
      会运行时报错或编码不一致。

    must_implement:
      - "重写 text/tokenizer.rs 使用 sentencepiece::SentencePieceProcessor"
      - "保持公开 API 不变：load(&Path), encode(&str)->Vec<u32>, decode(&[u32])->String,
         count_tokens(&str)->usize, vocab_size()->usize"
      - "新增 tests/data/ 多语种 fixture（中/英/日 各 3 行）做 round-trip 一致性测试"
      - "保留 from_model_dir(&Path) 便利方法"

    impl_targets:
      - src-tauri/src/modules/tts/text/tokenizer.rs
      - src-tauri/tests/data/tts_tokenizer_cases.txt

    acceptance:
      - "cargo test -p if2ai-backend modules::tts::text::tokenizer 通过（含 round-trip）"
      - "encode → decode → encode 张量级一致"
      - "Python 同 tokenizer.model 同一文本编码完全一致（有真模型时验证）"

    review_checklist:
      - "公开 API 与原文件签名兼容（chunker.rs 调用方无需改）"
      - "错误转换 sentencepiece::SentencePieceError → TtsError::TokenizationError"

  # ─────────────────────────────────────────────────────────────
  # Slice TTS-A.4: Reference audio loader（解决 Gap #4）
  # ─────────────────────────────────────────────────────────────
  - id: "TTS-A.4"
    name: Reference audio loader (symphonia + rubato)
    status: pending
    priority: P0
    design_ref: docs/design-docs/postCLI/TTS/tts_gap_analysis_report.md §3.3
    estimated_days: 1.5

    current_state: |
      audio/wav.rs 只能解码 16-bit PCM WAV。
      Voice clone 必须能加载任意采样率/声道/格式（wav/mp3/flac/ogg）的 prompt
      音频，并归一化到 codec 期望的 48 kHz / stereo / f32 / [-1,1]。
      Python: torchaudio.load + torchaudio.functional.resample + 通道处理。

    must_implement:
      - "src-tauri/src/modules/tts/audio/reference.rs — load_reference_audio(&Path,
         target_sample_rate, target_channels) -> Result<ReferenceWaveform>"
      - "ReferenceWaveform { samples: Vec<f32> (interleaved), sample_rate: u32,
         channels: u16, duration_seconds: f32 }"
      - "内部三阶段：(1) symphonia::default::get_probe() 探测格式 →
         get_codecs() 解码任意 codec 到 f32 → (2) rubato::SincFixedIn 重采样 →
         (3) 通道转换：mono→stereo 复制 / stereo→mono 平均 / N-ch→target 通用"
      - "audio/mod.rs: pub mod reference"

    impl_targets:
      - src-tauri/src/modules/tts/audio/reference.rs
      - src-tauri/src/modules/tts/audio/mod.rs

    acceptance:
      - "cargo test -p if2ai-backend modules::tts::audio::reference 通过"
      - "16k mono wav → 48k stereo: 样本数 ≈ 输入 × (48000/16000) × 2 ±10"
      - "44.1k stereo wav → 48k stereo: 样本数 ≈ 输入 × (48000/44100) ±10"
      - "测试包含 mp3 → 48k stereo（用嵌入小 mp3 fixture）"
      - "RMS 能量重采样前后差异 < 5%"

    review_checklist:
      - "rubato 用 SincFixedIn + WindowFunction::BlackmanHarris2（接近 torchaudio 默认）"
      - "i16/i24/f32 source samples 全部走统一 f32 [-1,1] 归一化"
      - "Drop / 资源释放正确"

  # ─────────────────────────────────────────────────────────────
  # Slice TTS-A.5: build_voice_clone_request_rows 协议组装
  # ─────────────────────────────────────────────────────────────
  - id: "TTS-A.5"
    name: Voice-clone request 协议组装（解决 Gap #1 上半段）
    status: pending
    priority: P0
    design_ref: docs/design-docs/postCLI/TTS/tts_gap_analysis_report.md §1.2
    estimated_days: 0.5

    current_state: |
      Python build_voice_clone_request_rows() 把 prompt_audio_codes 与 text_token_ids
      按 [user_prefix + audio_start] + audio_prefix_rows + [audio_end + after_reference
      + text_ids + assistant_prefix + audio_start] 编排成 input_ids[L, n_vq+1] +
      attention_mask[1, L]。Rust 完全不存在。

    must_implement:
      - "src-tauri/src/modules/tts/inference/request_builder.rs"
      - "pub fn build_voice_clone_request_rows(manifest, prompt_audio_codes,
         text_token_ids) -> RequestRows"
      - "RequestRows { input_ids: Vec<Vec<i32>> (L × n_vq+1), attention_mask: Vec<i32> (L) }"
      - "build_text_rows / build_audio_prefix_rows 内部辅助，行宽 = n_vq+1，pad token
         填充其余位"
      - "单元测试：用 fixture manifest 跑出 rows 与 Python 同 prompt+text 逐位一致"

    impl_targets:
      - src-tauri/src/modules/tts/inference/request_builder.rs
      - src-tauri/src/modules/tts/inference/mod.rs

    acceptance:
      - "cargo test -p if2ai-backend modules::tts::inference::request_builder 通过"
      - "row_width == n_vq + 1 在所有用例中保持"
      - "attention_mask 长度 == input_ids.len()"

    review_checklist:
      - "完全 1:1 复刻 ort_cpu_runtime.py:456-476 的逻辑"
      - "pub fn 文档注释引用 Python 行号"

