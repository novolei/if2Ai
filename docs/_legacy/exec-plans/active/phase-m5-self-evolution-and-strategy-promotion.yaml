    application/turn_service.rs 在 prepare_chat_inputs 阶段单 hook 接入 —— 不重写 commands/agent.rs。
    入场前置依然成立（M4 backend complete, frontend governance deferred）。
    详见 docs/exec-plans/active/phase-m4-policy-harness-governance.yaml
    与 docs/exec-plans/active/phase-m-remediation-execution-index.md §M5。
