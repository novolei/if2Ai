    - m5.4 candidate registry：M5-A done；M5-C 闭环加 history 栈、StrategyDefinition、SupersedeRecord。
    - m5.5 offline eval：compare-pair + suite-pair 双 evaluator + IPC + cross-store 校验。
    - m5.6 gated promotion + rollback：PromotionBasis 政策（默认 RequireBoth）+ Active / RolledBack
      契约 + audit chain + singleton-active enforcement + supersede 自动 rollback。
    - m5.7 diagnostics surfaces：StrategyDiagnosticsPage 接 IPC，settings nav 已挂入；
      治理面 not 营销面板。
    - m5.8 safety / regression：107 lib 单测 + 1 phase-level cross-module integration test
