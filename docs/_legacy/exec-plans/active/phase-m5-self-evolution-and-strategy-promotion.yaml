    design_ref: "docs/staff-remediation/memory-self-evolution-design.md"
    impl_targets:
      - src-tauri/src/modules/learning/
      - src-tauri/src/modules/harness/
    must_implement:
      - "建立 candidate strategy 注册模型"
      - "标记 rollout_state（M5-A 闭集 + M5-B 扩展 + M5-C 补 Active / RolledBack）"
      - "关联来源：reflection / human feedback / curated rule"
    acceptance:
      - type: manual
        text: "candidate strategy registry 结构人工审查通过（M5-A reconciliation 已确认）"
    review_checklist:
      - "strategy registry 必须可审计"
      - "active/candidate/rollback 边界必须清晰（contract 阶段 OK；执行真正的 active flip 留 M5-D）"

  - id: "m5.5"
    title: "Run offline eval for candidate strategies"
    status: done_at_foundation_level
    completion_evidence:
      - "M5-B `CandidateEvaluator::evaluate_candidate` 把 candidate 通过 M4 `compare_reports` + M4.8 `gate_evaluate_compare` 跑完，并双写 `last_compare_ref` / `last_recommendation_ref` 到 registry。"
      - "默认走 GatePolicy::default_conservative；缺 recommendation / compare 时绝不返回 Promote。"
      - "IPC：learning_evaluate_candidate / learning_evaluate_candidate_with_policy。"
      - "cross-store 校验：baseline_run_id / candidate_run_id 必须在 HarnessReportStore 存在，否则拒绝。"
    deliberately_not_done:
      - "candidate `HarnessRunReport` 的真正生成（依赖 executable strategy DSL，留 M5-D+）。"
      - "suite-level evaluation 在 registry 的 ref 持久化（compare-pair 已通；suite ref scheme 留 M5-C 第二轮或 M5-D）。"
    design_ref: "docs/staff-remediation/harness-v2-governance-design.md"
    impl_targets:
      - harness/
      - src-tauri/src/modules/harness/
      - src-tauri/src/modules/learning/
    must_implement:
      - "candidate strategy 必须通过 harness compare（compare-pair foundation 已通）"
      - "输出 promote / hold / reject recommendation"
      - "形成 offline eval 执行路径"
    acceptance:
      - type: manual
        text: "至少一条 candidate strategy 可完成 offline compare 评估（M5-B reconciliation 已确认）"
    review_checklist:
      - "无 compare 不可 promote"
      - "至少覆盖 prompt / memory / policy 中的一类 strategy（仍待 strategy DSL）"

  - id: "m5.6"
    title: "Implement gated promotion and rollback semantics"
    status: done
    completion_evidence:
      - "promotion_gate.rs 引入 PromotionBasis（CompareOnly / SuiteOnly / RequireBoth / EitherSufficient），默认 RequireBoth；compare-pair 与 suite-driven recommendation 治理关系正式收敛。"
      - "Active / RolledBack 已落 RolloutState 闭集 + ActivationAudit + RollbackAudit + RollbackTarget + SupersedeRecord。"
      - "strategy_rollout.rs 强制 singleton-active：activate 新 candidate 时若已有 Active，typed 写 RollbackAudit + SupersedeRecord 自动 supersede。"
      - "rollback target validation：refuse self-target / 不存在 target / 空 reason / 空 initiated_by。"
      - "production active flip 最小闭环：active 候选的 StrategyDefinition 通过 ActiveStrategyOverlayResolver 投影成 PromptBlockKind::ActiveStrategyOverlay，由 turn_service.rs 单 hook 接入；不重写 commands/agent.rs。"
      - "Noop definition 拒绝 activation（必须先 set_definition）。"
    file_level_plan_rename:
      - "原 file-level plan §5.2 提到 `strategy_promotion.rs`，实际落地为 `promotion_gate.rs`（命名等价、职责相同）；M5-C 的 rollback service 落到 `strategy_rollout.rs`，承担 promotion->Active->RolledBack 状态机。"
    design_ref: "docs/staff-remediation/memory-self-evolution-design.md"
    impl_targets:
      - src-tauri/src/modules/learning/
      - src-tauri/src/modules/harness/
    must_implement:
      - "candidate -> active 的 promote 需走 gate（promotion gate skeleton done；activate 落 M5-C 第一轮）"
      - "支持 rollback_reason 与 rollback path（M5-C 第一轮落 typed contract + service）"
      - "禁止单次成功样本直接升默认（gate hard rule already enforced）"
    acceptance:
      - type: manual
        text: "promotion/rollback 语义与 gate 规则人工审查通过（promotion-skeleton ✓；rollback contract M5-C 第一轮）"
    review_checklist:
      - "gated promotion 必须复用 M4 gate 规则（已复用 evaluate_compare）"
      - "rollback 不能停留在文档描述（M5-C 第一轮把它落到代码）"

  - id: "m5.7"
    title: "Project strategy lifecycle into diagnostics surfaces"
    status: done
    completion_evidence:
      - "src/modules/settings/pages/StrategyDiagnosticsPage.tsx 是治理诊断面（不是营销面板）。"
      - "数据全部来自真实 IPC：learningListCandidates / learningGetCandidate / learningGetActiveStrategies / learningResolveActiveOverlay；零 mock seed data。"
      - "页面已在 src/modules/settings/data.ts 注册并接入 SettingsApp 路由。"
      - "可见维度：candidate list、current active strategy + overlay 文本、最近 compare/suite recommendation、5 条 history（compare / recommendation / suite / activation / rollback）、superseded_by / rollback_audit。"
    design_ref: "docs/staff-remediation/memory-self-evolution-design.md"
    impl_targets:
      - src/modules/settings/
      - src/components/chat/
      - src/state/
    must_implement:
      - "展示 candidate / active / rollback 状态"
      - "展示 strategy 来源、compare 结果、最近 recommendation"
      - "让 diagnostics 页面可见 recall gain / failure notes / suppression"
    acceptance:
      - type: compile
        cmd: "npm run build:web"
    review_checklist:
      - "自我进化面必须是治理面，不是营销面"
      - "信息来源必须对齐实际 evaluator 输出"

  - id: "m5.8"
    title: "Add self-evolution safety and regression checks"
    status: done
    completion_evidence:
      - "src-tauri/tests/m5_self_evolution_integration.rs 走完整 lifecycle：register → set_definition → evaluate(compare+suite) → apply_gate → mark_promoted → activate → resolve overlay → 第二次 activate 触发 supersede → 显式 rollback（含目标校验）。"
      - "覆盖关键 reject path：'wrong-promote' candidate 只有 compare 没有 suite，RequireBoth 拦下 mark_promoted_candidate。"
      - "覆盖典型故障路径：reflection_generator 在低质量 run 上必产 typed notes；rollback target self-reference / 不存在 target 都被 typed error 拒绝。"
      - "lib 单元测试 107 / 107 passed（trajectory / clustering / reflection / promotion / rollout / overlay 全模块）。"
    design_ref: "docs/staff-remediation/memory-self-evolution-design.md"
    impl_targets:
      - src-tauri/src/modules/learning/
      - src-tauri/src/integration_tests.rs
      - harness/
    must_implement:
      - "补充 strategy registry / promote / rollback / candidate generation 测试"
      - "覆盖至少一条错误推广被 gate 拦下的场景"
    acceptance:
      - type: manual
        text: "self-evolution safety checks 人工抽查通过"
    review_checklist:
      - "必须证明‘会学习’不会变成‘随机漂移’"
      - "至少一条 reject path 必须有测试或回放案例"

notes: |
  Phase M5 closeout（2026-04-21）。

  完成口径（每条都有代码 / 测试 / 文档支撑）：
  1. candidate strategy registry 出现 —— ✓
  2. trajectory / failure traces → structured reflection notes →
     candidate strategy → compare/suite eval → promote/hold/reject →
     active rollout → rollback / supersede →
     diagnostics surfaces 闭环成立 —— ✓
  3. rollback 语义清晰且受 harness gate 约束 —— ✓（PromotionBasis::RequireBoth
     默认；singleton-active enforcement；rollback target validation）
  4. production active flip 最小闭环：active 候选通过 ActiveStrategyOverlayResolver
     注入到 PromptPlan.ActiveStrategyOverlay 块 —— ✓（turn_service.rs 单 hook，
     不重写 commands/agent.rs）

  M5 显式不做（视为 M5 完成后的 enhancement，不阻塞 M5 验收）：
  - 自动触发 reflection generation（当前是 IPC / 显式 service 调用 —— hook 候选挂点
    已在 reflection_generator.rs 顶部注释中钉死，等 session-end / harness finalised
    事件 hook 在 M6 引入再接入）。
  - executable strategy DSL（当前 StrategyDefinition 闭集只包含 Noop /
    PromptOverlay / DiscourageTool —— 三种已经能让 active 影响真实 turn 行为，
    更复杂策略形态留 M6）。
  - per-corpus-tier weighted gate policy（M4 enhancement）。
  - closed-set evidence_ref scheme（M4 enhancement）。
  - auto-promote / auto-rollback automation（M6 范围；当前所有迁移仍需操作员显式
    IPC 调用）。

  禁止双标：本 phase 任何文档若与代码现实冲突，以代码为准。
