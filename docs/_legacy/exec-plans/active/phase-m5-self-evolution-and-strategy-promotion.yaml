slices:

  - id: "m5.1"
    title: "Introduce trajectory scoring model"
    status: done
    completion_evidence:
      - "src-tauri/src/modules/learning/trajectory_score.rs 提供 typed TrajectoryScore（5 个轴 + composite）+ score_run_report / score_compare。"
      - "Completion 权重 0.6，Recovery / Tool / Memory / Governance 各 0.1，sum == 1.0。"
      - "失败 run 必产 is_low_quality=true（见单元测试 failed_run_scores_low）。"
    design_ref: "docs/staff-remediation/memory-self-evolution-design.md"
    impl_targets:
      - src-tauri/src/modules/learning/
      - src-tauri/src/modules/memory/
    must_implement:
      - "定义 trajectory scoring 入口"
      - "让 run outcome、grader failures、memory events 能参与评分"
      - "输出可比较的 trajectory score"
    acceptance:
      - type: compile
        cmd: "cargo check --manifest-path src-tauri/Cargo.toml"
    review_checklist:
      - "trajectory score 不能只是 token/latency 分数"
      - "应能体现完成率、恢复质量、memory 对齐"

  - id: "m5.2"
    title: "Introduce failure clustering pipeline"
    status: done
    completion_evidence:
      - "src-tauri/src/modules/learning/failure_taxonomy.rs 提供闭集 FailureCategory（intent_miss / policy_issue / memory_issue / recovery_issue / tool_misuse / other）+ classify_blocking_failure 启发式映射（基于 code 关键字 + severity 兜底）。"
      - "src-tauri/src/modules/learning/failure_clustering.rs 提供 FailureCluster / FailureSignature / ClusteredFailureSet + cluster_failures 跨多 report 聚合 + 重复 code 计数。"
      - "reflection_generator 直接消费 ClusteredFailureSet 生成 typed ReflectionNote，证明 m5.2 能驱动 m5.3。"
    design_ref: "docs/staff-remediation/memory-self-evolution-design.md"
    impl_targets:
      - src-tauri/src/modules/learning/
      - src-tauri/src/modules/harness/
    must_implement:
      - "把 recurring failures 聚类"
      - "区分 intent miss / policy issue / memory issue / recovery issue / tool misuse 等类别"
      - "让 reflection 可以消费 cluster 结果"
    acceptance:
      - type: manual
        text: "failure taxonomy 与 clustering 结构审查通过"
    review_checklist:
      - "clustering 结果必须可用于 candidate generation"
      - "分类不得仅依赖自然语言错误串"

  - id: "m5.3"
    title: "Generate structured reflection notes from runs"
    status: done
    completion_evidence:
      - "src-tauri/src/modules/learning/reflection_generator.rs 提供 generate_reflection_notes：消费 trajectory_score + cluster_failures，按 'low_quality + 至少一个 cluster' 触发策略产出 typed ReflectionNote。"
      - "auto-trigger 挂点已在模块 doc-comment 钉死：'session-end / harness 报告 finalised 之时'，调用入口为 IPC learning_generate_reflection_for_report(run_id) 与 service 层 generate_reflection_notes(report)。"
      - "legacy reflection_note::from_legacy_reflection 适配器保留为 explicit 路径（IPC learning_reflect_session_and_register），与新 producer 共存不互相覆盖。"
      - "FailureCategory → ReflectionIssueType 的映射闭集；每条 note 必带至少一条 evidence ref + risk_level 派生自 cluster max_severity。"
    design_ref: "docs/staff-remediation/memory-self-evolution-design.md"
    impl_targets:
      - src-tauri/src/modules/learning/
    must_implement:
      - "从 trace/outcome/grader failures 生成结构化 reflection notes"
      - "至少包含 issue_type / evidence / proposed_strategy / expected_gain / risk_level"
      - "与 M3 reflection seam 对齐"
    acceptance:
      - type: compile
        cmd: "cargo check --manifest-path src-tauri/Cargo.toml"
    review_checklist:
      - "reflection 不得直接改 active policy"
      - "必须引用可追踪 evidence"

  - id: "m5.4"
    title: "Introduce candidate strategy registry"
    status: done
    completion_evidence:
      - "M5-A 已交付：strategy_registry.rs / strategy_registry_store.rs / strategy_registry_service.rs。"
      - "rollout_state 闭集已落地 Draft / Candidate / Compared / Recommended / Rejected / Deprecated（M5-A）。"
      - "rollout_state 闭集已扩展 PromotionReady / PromotionBlocked / PromotedCandidate（M5-B）。"
      - "rollout_state 闭集将由 M5-C 第一轮再补 Active / RolledBack（rollback audit chain 同步落 typed contract）。"
      - "StrategySource 已覆盖 reflection / manual / curated_rule / other。"
    notes_for_executor: |
      m5.4 不再要求"必须已经存在 active / rollback"——active / rollback 的真实落地由 M5-C 第一轮承担，
