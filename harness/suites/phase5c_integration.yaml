    description: "SystemPromptBuilder builds dynamic prompts (N1)"
  - test_fn: "modules::tools::builtin::todo_write"
    description: "TodoWrite tool entry + async handler (N3)"
  - test_fn: "modules::tools::builtin::skill"
    description: "Skill tool entry + discover_skill_roots (F6)"
  - test_fn: "modules::runtime::permissions"
    description: "PermissionPolicy with different modes (F3)"
  - test_fn: "modules::tools::integration_phase4"
    description: "All builtin tools registered including TodoWrite + Skill (N3, F6)"
