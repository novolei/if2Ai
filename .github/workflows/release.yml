name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Path to the generated If2Ai release manifest.
        required: true
        default: dist/release/if2ai-release-manifest.json
      channel:
        description: Release channel to validate.
        required: true
        default: stable

jobs:
  build-signed-updater-artifacts:
    name: release-ci::build_signed_updater_artifacts
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-13
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          IF2AI_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: If2Ai ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'nightly') }}
          args: ${{ matrix.args }}

      - name: Verify signed updater assets exist
        run: |
          find src-tauri/target/release/bundle -type f \( -name '*.app.tar.gz' -o -name '*.sig' -o -name '*.dmg' \) -print
          test -n "$(find src-tauri/target/release/bundle -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$(find src-tauri/target/release/bundle -type f -name '*.app.tar.gz.sig' -print -quit)"

  app-updater-manifest-gate:
    name: release-ci::app_updater_manifest_gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate app updater release manifest
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node scripts/validate-release-manifest.mjs "$MANIFEST_PATH" "$RELEASE_CHANNEL"
