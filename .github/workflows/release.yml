name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      release_targets:
        description: "Release build targets: arm64 or universal."
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - universal
      manifest_path:
        description: Path to the generated If2Ai release manifest.
        required: false
        default: dist/release/if2ai-release-manifest.json
      channel:
        description: Release channel to validate.
        required: false
        default: stable

jobs:
  build-signed-updater-artifacts:
    name: release-ci::build_signed_updater_artifacts
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event.inputs.release_targets == 'universal' && '{"include":[{"runner":"macos-15","target":"aarch64-apple-darwin","tauri_platform":"darwin-aarch64","platform":"darwin","arch":"aarch64"},{"runner":"macos-15-intel","target":"x86_64-apple-darwin","tauri_platform":"darwin-x86_64","platform":"darwin","arch":"x86_64"}]}' || '{"include":[{"runner":"macos-15","target":"aarch64-apple-darwin","tauri_platform":"darwin-aarch64","platform":"darwin","arch":"aarch64"}]}') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            src-tauri/target/
          key: release-cargo-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            release-cargo-${{ runner.os }}-${{ matrix.target }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Install native build dependencies
        run: |
          brew install protobuf
          echo "PROTOC=$(brew --prefix protobuf)/bin/protoc" >> "$GITHUB_ENV"
          "$(brew --prefix protobuf)/bin/protoc" --version

      - name: Build signed Tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          IF2AI_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: npm run build -- --target ${{ matrix.target }}

      - name: Verify signed updater assets exist
        run: |
          set -euo pipefail
          BUNDLE_ROOTS=()
          [[ -d target ]] && BUNDLE_ROOTS+=(target)
          [[ -d src-tauri/target ]] && BUNDLE_ROOTS+=(src-tauri/target)
          if [[ ${#BUNDLE_ROOTS[@]} -eq 0 ]]; then
            echo "No Tauri target directories found"
            exit 1
          fi
          find "${BUNDLE_ROOTS[@]}" -type f \( -name '*.app.tar.gz' -o -name '*.sig' -o -name '*.dmg' \) -print
          test -n "$(find "${BUNDLE_ROOTS[@]}" -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$(find "${BUNDLE_ROOTS[@]}" -type f -name '*.app.tar.gz.sig' -print -quit)"
          test -n "$(find "${BUNDLE_ROOTS[@]}" -type f -name '*.dmg' -print -quit)"

      - name: Stage release assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TAURI_PLATFORM: ${{ matrix.tauri_platform }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION#v}"
          OUT_DIR="dist/release-artifacts/${RELEASE_TAURI_PLATFORM}"
          export OUT_DIR
          mkdir -p "$OUT_DIR"

          BUNDLE_ROOTS=()
          [[ -d target ]] && BUNDLE_ROOTS+=(target)
          [[ -d src-tauri/target ]] && BUNDLE_ROOTS+=(src-tauri/target)
          if [[ ${#BUNDLE_ROOTS[@]} -eq 0 ]]; then
            echo "No Tauri target directories found"
            exit 1
          fi

          echo "Available release assets:"
          find "${BUNDLE_ROOTS[@]}" -type f \( -name '*.app.tar.gz' -o -name '*.sig' -o -name '*.dmg' \) -print

          INSTALLER="$(find "${BUNDLE_ROOTS[@]}" -type f -name '*.dmg' ! -name 'rw.*.dmg' -print | sort | tail -n 1)"
          UPDATER="$(find "${BUNDLE_ROOTS[@]}" -type f -name '*.app.tar.gz' -print | sort | tail -n 1)"
          SIGNATURE="${UPDATER}.sig"

          test -n "$INSTALLER"
          test -n "$UPDATER"
          test -f "$SIGNATURE"

          INSTALLER_OUT="$OUT_DIR/If2Ai_${VERSION}_${RELEASE_ARCH}.dmg"
          UPDATER_OUT="$OUT_DIR/If2Ai_${VERSION}_${RELEASE_TAURI_PLATFORM}.app.tar.gz"
          SIGNATURE_OUT="${UPDATER_OUT}.sig"

          cp "$INSTALLER" "$INSTALLER_OUT"
          cp "$UPDATER" "$UPDATER_OUT"
          cp "$SIGNATURE" "$SIGNATURE_OUT"

          node - <<'NODE'
          const fs = require('node:fs')
          const entry = {
            platform: process.env.RELEASE_PLATFORM,
            arch: process.env.RELEASE_ARCH,
            tauri_target: process.env.RELEASE_TAURI_PLATFORM,
            installer_path: `${process.env.OUT_DIR || `dist/release-artifacts/${process.env.RELEASE_TAURI_PLATFORM}`}/If2Ai_${process.env.RELEASE_VERSION.replace(/^v/, '')}_${process.env.RELEASE_ARCH}.dmg`,
            updater_path: `${process.env.OUT_DIR || `dist/release-artifacts/${process.env.RELEASE_TAURI_PLATFORM}`}/If2Ai_${process.env.RELEASE_VERSION.replace(/^v/, '')}_${process.env.RELEASE_TAURI_PLATFORM}.app.tar.gz`,
            signature_path: `${process.env.OUT_DIR || `dist/release-artifacts/${process.env.RELEASE_TAURI_PLATFORM}`}/If2Ai_${process.env.RELEASE_VERSION.replace(/^v/, '')}_${process.env.RELEASE_TAURI_PLATFORM}.app.tar.gz.sig`,
          }
          fs.writeFileSync(`${process.env.OUT_DIR || `dist/release-artifacts/${process.env.RELEASE_TAURI_PLATFORM}`}/artifact-set.json`, `${JSON.stringify({ artifacts: [entry] }, null, 2)}\n`)
          NODE

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.tauri_platform }}
          path: dist/release-artifacts/${{ matrix.tauri_platform }}

  publish-release-manifest:
    name: release-ci::publish_release_manifest
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-signed-updater-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist/release-artifacts

      - name: Merge release artifact set
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = 'dist/release-artifacts'
          const entries = []
          function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              const file = path.join(dir, name)
              const stat = fs.statSync(file)
              if (stat.isDirectory()) walk(file)
              else if (name === 'artifact-set.json') {
                const artifactSet = JSON.parse(fs.readFileSync(file, 'utf8'))
                const dir = path.dirname(file)
                entries.push(...artifactSet.artifacts.map((entry) => ({
                  ...entry,
                  installer_path: path.join(dir, path.basename(entry.installer_path)),
                  updater_path: path.join(dir, path.basename(entry.updater_path)),
                  signature_path: path.join(dir, path.basename(entry.signature_path)),
                })))
              }
            }
          }
          walk(root)
          entries.sort((a, b) => `${a.platform}-${a.arch}`.localeCompare(`${b.platform}-${b.arch}`))
          if (entries.length === 0) throw new Error('no release artifact entries found')
          fs.writeFileSync(path.join(root, 'artifact-set.json'), `${JSON.stringify({ artifacts: entries }, null, 2)}\n`)
          console.log(JSON.stringify(entries, null, 2))
          NODE

      - name: Publish GitHub Release manifests and assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/publish-github-release.mjs \
            --artifact-set=dist/release-artifacts/artifact-set.json \
            --repo="${GITHUB_REPOSITORY}" \
            --channel=stable \
            --version="${VERSION}" \
            --tag="${GITHUB_REF_NAME}"

  app-updater-manifest-gate:
    name: release-ci::app_updater_manifest_gate
    if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Validate app updater release manifest
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: node scripts/validate-release-manifest.mjs "$MANIFEST_PATH" "$RELEASE_CHANNEL"
