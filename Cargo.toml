[workspace]
members = ["src-tauri"]
exclude = ["activation-server-rs"]
resolver = "2"

# ─────────────────────────────────────────────────────────────────────
# Build profile tweaks — ALL profile config lives here at the workspace
# root, because Cargo silently ignores [profile.*] in member crates.
#
# [profile.dev]  — default for `cargo build` / `cargo run` / tauri dev
# [profile.test] — `cargo test`; inherits dev
# ─────────────────────────────────────────────────────────────────────

[profile.dev]
# Stack traces still work; just no full local-variable debuginfo.
debug = "line-tables-only"
codegen-units = 256
# Incremental dev builds: faster `cargo check` / edit cycles for local work.
# If you use `RUSTC_WRAPPER=sccache`, switch this back to `false` — sccache
# and incremental together cause cache misses (Mozilla/sccache docs).
incremental = true

# Apply opt-level = 1 to all dependencies but leave first-party crates
# at opt-level = 0.  Heavy native deps (fastembed, lancedb, datafusion,
# arrow, ort, symphonia) get noticeably faster runtime + smaller object
# files at opt-level 1.
[profile.dev.package."*"]
opt-level = 1
codegen-units = 16

# Test binaries inherit dev (including incremental builds).
[profile.test]
inherits = "dev"

[profile.test.package."*"]
opt-level = 1
codegen-units = 16
