[package]
name = "if2ai-backend"
version = "0.1.0"
edition = "2021"
# 与 [[bin]] harness-cli 并存时，cargo run / tauri dev 需默认入口（否则 Cargo 无法选择 binary）
default-run = "if2ai-backend"

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
num_cpus = "1"
reqwest = { version = "0.11", features = ["json", "stream"] }
url = "2"
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
# Phase 8A.5 — reserved for 8A.9 PinnedItem.id (ULID lexicographically sortable
# by creation time, ideal for pinned-memory ordering).  Imported now so the
# 8A.9 slice does not need a Cargo.toml churn commit.
ulid = "1"
glob = "0.3"
regex = "1"
fancy-regex = "0.17"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
# Phase 8A §0.5 Δ-13/Δ-16 — IANA timezone DB used by `runtime::logical_day`
# to compute the system-wide 04:00 LOCAL day boundary used by all daily
# memory aggregations (compile_today/week, diary writer).
chrono-tz = "0.10"
thiserror = "1"
async-trait = "0.1"
sha2 = "0.9"
md5 = "0.7"
dashmap = "5"
hex = "0.4.3"
once_cell = "1"
tempfile = "3"
bytes = "1"
base64 = "0.22"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
fastembed = { version = "5", default-features = false, features = [
    "online",
    "ort-download-binaries",
] }
lancedb = "0.18"
arrow-array = "54"
arrow-schema = "54"
arrow-cast = "54"
half = "2"
futures = "0.3"
serde_yaml = "0.9"
sysinfo = "0.33"
chromiumoxide = { version = "0.9", default-features = true }
tiktoken-rs = "0.9.1"
# Phase 8A §0.5 Δ-10 — anyhow used by JobRunner closure return type
# (`Future<Output = anyhow::Result<T>>`) so callers can ?-bubble heterogeneous
# job-specific errors without all sharing one enum.
anyhow = "1"
# Phase 8A §0.5 Δ-10 — reserved for T-D3 daily_running flag (8B.x); imported
# now so subsequent ticker slices can use `scopeguard::defer!` without a
# Cargo.toml churn commit.  Not directly referenced by 8A.2 itself.
scopeguard = "1"

# ── TTS Module (MOSS-TTS-Nano ONNX native) ──
ort = { version = "=2.0.0-rc.10", features = ["ndarray", "half"] }
ndarray = "0.16"
tokenizers = "0.21"
hound = "3.5"
rand = "0.8"
unicode_categories = "0.1"

[[bin]]
name = "harness-cli"
path = "src/bin/harness_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
