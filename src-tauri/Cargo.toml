[package]
name = "if2ai-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
url = "2"
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
glob = "0.3"
regex = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
async-trait = "0.1"
sha2 = "0.9"
md5 = "0.7"
dashmap = "5"
hex = "0.4.3"
once_cell = "1"
tempfile = "3"
bytes = "1"
base64 = "0.22"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
fastembed = { version = "4", default-features = false, features = ["online", "ort-download-binaries"] }
lancedb = "0.18"
arrow-array = "54"
arrow-schema = "54"
arrow-cast = "54"
half = "2"
futures = "0.3"
serde_yaml = "0.9"
sysinfo = "0.33"
chromiumoxide = { version = "0.9", default-features = true }

[[bin]]
name = "harness-cli"
path = "src/bin/harness_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
