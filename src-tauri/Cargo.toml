[package]
name = "if2ai-backend"
version = "0.3.0"
edition = "2021"
# 与 [[bin]] harness-cli 并存时，cargo run / tauri dev 需默认入口（否则 Cargo 无法选择 binary）
default-run = "if2ai-backend"

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
num_cpus = "1"
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }
# STT-OF-1: open-flow vendor 的 SenseVoice ASR 用到的 FFT 实现
realfft = "3.4"
url = "2"
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
# Phase 8A.5 — reserved for 8A.9 PinnedItem.id (ULID lexicographically sortable
# by creation time, ideal for pinned-memory ordering).  Imported now so the
# 8A.9 slice does not need a Cargo.toml churn commit.
ulid = "1"
glob = "0.3"
regex = "1"
fancy-regex = "0.17"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
# Phase 8A §0.5 Δ-13/Δ-16 — IANA timezone DB used by `runtime::logical_day`
# to compute the system-wide 04:00 LOCAL day boundary used by all daily
# memory aggregations (compile_today/week, diary writer).
chrono-tz = "0.10"
thiserror = "1"
async-trait = "0.1"
sha2 = "0.9"
md5 = "0.7"
dashmap = "5"
hex = "0.4.3"
once_cell = "1"
tempfile = "3"
bytes = "1"
base64 = "0.22"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
fastembed = { version = "5", default-features = false, features = [
    "online",
    "ort-download-binaries",
] }
lancedb = "0.18"
arrow-array = "54"
arrow-schema = "54"
arrow-cast = "54"
half = "2"
futures = "0.3"
serde_yaml = "0.9"
sysinfo = "0.33"
chromiumoxide = { version = "0.9", default-features = true }
# Phase 7C, slice 7C.10 — proper CSS-selector based HTML parser for the
# `web_fetch` tool's `selector` mode and the lightweight readability
# heuristic that picks the highest-scored content node.
scraper = "0.20"
tiktoken-rs = "0.9.1"
# Phase 8A §0.5 Δ-10 — anyhow used by JobRunner closure return type
# (`Future<Output = anyhow::Result<T>>`) so callers can ?-bubble heterogeneous
# job-specific errors without all sharing one enum.
anyhow = "1"
# Phase 8A §0.5 Δ-10 — reserved for T-D3 daily_running flag (8B.x); imported
# now so subsequent ticker slices can use `scopeguard::defer!` without a
# Cargo.toml churn commit.  Not directly referenced by 8A.2 itself.
scopeguard = "1"

# ── TTS Module (MOSS-TTS-Nano ONNX native) ──
ort = { version = "=2.0.0-rc.10", features = ["ndarray", "half"] }
ndarray = "0.16"
# Phase TTS-E / P3: Whisper STT (whisper.cpp Rust FFI，Metal 加速 on macOS)
whisper-rs = { version = "0.16", features = ["metal"] }
# Phase TTS-A.3 → Python sidecar pivot：sentencepiece crate 链接的 libprotobuf
# 与 onnxruntime 的 libprotobuf 在 macOS 静态符号冲突，导致 ort 无法 parse onnx
# 文件。改走 Python sidecar 进程做 tokenization（见 text/tokenizer.rs）。
# 保留 tokenizers 暂不删除：其他模块可能在用。
tokenizers = "0.21"
# Phase TTS-A.4: reference audio 多格式解码（mp3/wav/flac/ogg）
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }
# Phase TTS-A.4: 高质量重采样（接近 torchaudio.functional.resample 默认）
rubato = "0.16"
hound = "3.5"
rand = "0.8"
unicode_categories = "0.1"

[[bin]]
name = "harness-cli"
path = "src/bin/harness_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ─────────────────────────────────────────────────────────────────────
# Build profile tweaks (added 2026-04-20 — cargo build acceleration)
#
# Why this exists:
#   `cargo build` cold-time was ~9 min mostly because debug deps were
#   compiled at opt-level 0 with full debuginfo.  fastembed / lancedb /
#   datafusion / arrow at opt-level 0 are very slow at runtime AND
#   produce huge object files that take long to link.
#
# Trade-offs:
#   - First-party code stays at opt-level 0 (fast incremental builds,
#     full debuggability).
#   - Third-party deps compile at opt-level 1 — ~10% slower to build
#     individually, but linker handles smaller object files much
#     faster, and runtime perf gain is large.
#   - debug = "line-tables-only" keeps stack traces but drops verbose
#     local-variable debuginfo we never inspect during dev — biggest
#     single link-time saver.
# ─────────────────────────────────────────────────────────────────────
[profile.dev]
# Stack traces still work; just no full local-variable debuginfo.
debug = "line-tables-only"
# Default codegen-units for first-party code (lower = better
# optimisation, higher = faster compile).  256 = same as Cargo
# default for dev; explicit so future tweaks have an anchor.
codegen-units = 256
# CRITICAL — must be `false` when `sccache` is the rustc-wrapper.
# Mozilla/sccache documented caveat: incremental compilation writes
# per-session metadata that breaks sccache's deterministic hash, so
# every Rust crate becomes an unconditional miss when both are on.
# Trade-off: full crate recompile on first-party file changes
# (instead of incremental partial), but sccache crate-level cache
# is the bigger win here (200+ crates × repeated branch switches).
#
# If sccache hit rate ever drops near 0% (broken cache, env churn),
# flip back to `true` and accept slower branch switches in exchange
# for faster single-file edits.
incremental = false

# Apply opt-level = 1 to **all dependencies** but leave first-party
# crates at opt-level = 0 (set below).  Heavy native deps (fastembed,
# lancedb, datafusion, arrow, ort, whisper-rs, symphonia) get
# noticeably faster runtime + smaller object files at opt-level 1.
[profile.dev.package."*"]
opt-level = 1
codegen-units = 16

# First-party crates — opt-level 0 keeps incremental rebuilds fast.
# (No explicit overrides needed; matches profile.dev default.)
# [profile.test] is defined in the workspace root Cargo.toml.
