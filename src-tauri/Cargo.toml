[package]
name = "if2ai-backend"
version = "0.9.0"
edition = "2021"
# 与 [[bin]] harness-cli 并存时，cargo run / tauri dev 需默认入口（否则 Cargo 无法选择 binary）
default-run = "if2ai-backend"

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
num_cpus = "1"
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }
# STT-OF-1: open-flow vendor 的 SenseVoice ASR 用到的 FFT 实现
realfft = "3.4"
url = "2"
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
# Phase 8A.5 — reserved for 8A.9 PinnedItem.id (ULID lexicographically sortable
# by creation time, ideal for pinned-memory ordering).  Imported now so the
# 8A.9 slice does not need a Cargo.toml churn commit.
ulid = "1"
glob = "0.3"
regex = "1"
aho-corasick = "1"
fancy-regex = "0.17"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
# Phase 8A §0.5 Δ-13/Δ-16 — IANA timezone DB used by `runtime::logical_day`
# to compute the system-wide 04:00 LOCAL day boundary used by all daily
# memory aggregations (compile_today/week, diary writer).
chrono-tz = "0.10"
# MEM-MOD-PD0 — Detect the host OS's IANA timezone so a fresh install
# defaults to the user's local zone (e.g. "Asia/Shanghai") instead of
# UTC.  Pure-Rust, no allocations on the hot path, used by `runtime::
# logical_day::resolve_timezone` when no override is set.
iana-time-zone = "0.1"
thiserror = "1"
async-trait = "0.1"
sha2 = "0.9"
md5 = "0.7"
dashmap = "5"
hex = "0.4.3"
once_cell = "1"
tempfile = "3"
bytes = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = [
    "alloc",
    "std",
] }
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
fastembed = { version = "5", default-features = false, features = [
    "online",
    "ort-download-binaries",
] }
lancedb = "0.18"
arrow-array = "54"
arrow-schema = "54"
arrow-cast = "54"
half = "2"
futures = "0.3"
serde_yaml = "0.9"
sysinfo = "0.33"
chromiumoxide = { version = "0.9", default-features = true }
# Phase 7C, slice 7C.10 — proper CSS-selector based HTML parser for the
# `web_fetch` tool's `selector` mode and the lightweight readability
# heuristic that picks the highest-scored content node.
scraper = "0.20"
tiktoken-rs = "0.9.1"
# Phase 8A §0.5 Δ-10 — anyhow used by JobRunner closure return type
# (`Future<Output = anyhow::Result<T>>`) so callers can ?-bubble heterogeneous
# job-specific errors without all sharing one enum.
anyhow = "1"
# Phase 8A §0.5 Δ-10 — reserved for T-D3 daily_running flag (8B.x); imported
# now so subsequent ticker slices can use `scopeguard::defer!` without a
# Cargo.toml churn commit.  Not directly referenced by 8A.2 itself.
scopeguard = "1"

# ── TTS Module (MOSS-TTS-Nano ONNX native) ──
ort = { version = "=2.0.0-rc.10", features = ["ndarray", "half"] }
ndarray = "0.16"
# Phase TTS-E / P3: STT — only OpenFlow (SenseVoice ONNX) is supported.
# `whisper-rs` removed (Apr 2026) — eliminates whisper.cpp C++/Metal compile
# (~3 min of cold build) and `MACOSX_DEPLOYMENT_TARGET=11.0` constraint.
# Phase TTS-A.3 → Python sidecar pivot：sentencepiece crate 链接的 libprotobuf
# 与 onnxruntime 的 libprotobuf 在 macOS 静态符号冲突，导致 ort 无法 parse onnx
# 文件。改走 Python sidecar 进程做 tokenization（见 text/tokenizer.rs）。
# 保留 tokenizers 暂不删除：其他模块可能在用。
tokenizers = "0.21"
# Phase TTS-A.4: reference audio 多格式解码（mp3/wav/flac/ogg）
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }
# Phase TTS-A.4: 高质量重采样（接近 torchaudio.functional.resample 默认）
rubato = "0.16"
hound = "3.5"
rand = "0.8"
unicode_categories = "0.1"
sys-locale = "0.3"

[[bin]]
name = "harness-cli"
path = "src/bin/harness_cli.rs"

[build-dependencies]
base64 = "0.22"
tauri-build = { version = "2", features = [] }

# All build profile customizations live in the workspace root Cargo.toml
# (Cargo silently ignores [profile.*] in non-root members of a workspace).

# ─────────────────────────────────────────────────────────────────────
# Workspace lints (PERF-001 baseline, 2026-04-21):
#   m3/m4/m5 modules introduced ~35 clippy errors. We split them into:
#   (a) stylistic categories — silence here at workspace level with
#       documented rationale; revisit when those modules get refactored.
#   (b) genuine code-quality issues — fixed in-place (see commits
#       `chore(clippy): ...`).
# This keeps `cargo clippy --workspace -D warnings` green so the
# code-reviewer subagent can auto-pass for new packs.
# ─────────────────────────────────────────────────────────────────────
[lints.clippy]
# Markdown style preferences inside doc comments. CommonMark renderers
# (rustdoc, GitHub) handle both indentations; not worth churning the
# m3/m4/m5 docstrings.
doc_overindented_list_items = "allow"
doc_lazy_continuation = "allow"
# Type aliases would help readability but are invasive to introduce
# now; tts/openflow/* and tts/provider/onnx use Result<Vec<(K,V,...)>, E>
# style chains.
type_complexity = "allow"
# `for i in 0..n { v[i] }` is intentional for ndarray-style index math
# in tts/audio/* and tts/model/*; .iter().enumerate() obscures the
# multi-axis indexing.
needless_range_loop = "allow"
# Used intentionally for fire-and-forget async tasks in harness.
let_underscore_future = "allow"
# `if a {} else if b {}` with intentionally-identical short blocks
# kept for clarity in early-return branches.
if_same_then_else = "allow"
# `Result<T, BigError>` shape is intentional in harness/event_bus where
# the error variant carries diagnostic context; boxing not yet wired.
result_large_err = "allow"
# `Default` for unit struct ctor — used in m3/m4/m5 for symmetry with
# other components that have non-unit defaults.
default_constructed_unit_structs = "allow"
# `impl Default { fn default }` written by hand for documentation;
# would be derived if every field's default were trivial.
derivable_impls = "allow"
# Naming convention conflict with std::str::FromStr; m3 modules use
# `from_str` as a domain-specific constructor.
should_implement_trait = "allow"
# Unit-typed let-bindings used for explicit `_ =` style discard.
let_unit_value = "allow"
# `assert!(true)` / `assert!(false)` used in test scaffolding.
assertions_on_constants = "allow"
# Some functions in m4/m5 (gate evaluators, harness adapters) have
# many arguments by design; refactor to a struct would obscure call
# sites. Allow until those modules get their own refactor pass.
too_many_arguments = "allow"

[lints.rust]
# Pre-existing dead_code on m3/m4/m5 struct fields (e.g.
# SttTranscribeRequest.provider_override) — to be cleaned in a
# dedicated PERF pack alongside the field-level audit.
dead_code = "allow"
