# Cargo build env overrides for native C/C++ deps.
#
# MACOSX_DEPLOYMENT_TARGET = 11.0:
#   - Apple Silicon never shipped before Big Sur (11.0), so this is the
#     real minimum on aarch64-apple-darwin anyway.
#   - Aligned with `tauri.conf.json` `bundle.macOS.minimumSystemVersion`.
#   - Originally added because whisper-rs-sys's std::filesystem usage
#     required >= 10.15.  whisper-rs has since been removed (Apr 2026,
#     STT now uses ONNX-based SenseVoice via `ort`), but we keep this
#     pin to prevent any other native dep from silently downgrading.
[env]
MACOSX_DEPLOYMENT_TARGET = "11.0"
