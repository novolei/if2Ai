# Cargo build env overrides for native C/C++ deps.
#
# Why: whisper-rs-sys (whisper.cpp / ggml-backend-reg.cpp) uses
# std::filesystem::path, which Apple's libc++ marks as
# `unavailable: introduced in macOS 10.15`.  Without this override,
# Tauri / cargo defaults push the deployment target down to 10.13,
# which breaks the whisper.cpp build with errors like:
#
#   error: 'path' is unavailable: introduced in macOS 10.15
#
# Apple Silicon never shipped before Big Sur (11.0), so 11.0 is the
# correct minimum here.  cmake-rs and cc-rs both honour
# MACOSX_DEPLOYMENT_TARGET, so this single env var fixes every native
# dependency at once.
[env]
MACOSX_DEPLOYMENT_TARGET = "11.0"
